<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cadastro VagaConnect</title>

<link rel="stylesheet" href="../CSS/OpçãoCadastro.css">
</head>

<body>

<div class="bg"></div>

<div class="container">

    <div class="logo">
        <h1>Vaga<span>Connect</span></h1>
        <p>Sistema Inteligente de Estacionamento</p>
    </div>

    <!-- BOTÕES -->
    <div class="toggle-buttons">

        <button id="usuarioBtn" class="active">Usuário</button>
        <button id="adminBtn">Admin</button>
        <button id="funcionarioBtn">Funcionário</button>

    </div>

    <!-- TEXTO -->
    <div class="tipo-cadastro" id="tipoTexto">
        Cadastro de Usuário
    </div>

    <!-- FORMULÁRIO -->
    <form id="formulario"></form>

</div>

<script>

// ===============================
// ELEMENTOS
// ===============================
const usuarioBtn = document.getElementById("usuarioBtn");
const adminBtn = document.getElementById("adminBtn");
const funcionarioBtn = document.getElementById("funcionarioBtn");
const formulario = document.getElementById("formulario");
const tipoTexto = document.getElementById("tipoTexto");

// ===============================
// RESET BOTÕES
// ===============================
function removerActive(){
    usuarioBtn.classList.remove("active");
    adminBtn.classList.remove("active");
    funcionarioBtn.classList.remove("active");
}

// ===============================
// MÁSCARA CPF
// ===============================
function aplicarMascaraCPF(input) {
    input.addEventListener("input", () => {
        let value = input.value.replace(/\D/g, "");

        value = value.replace(/(\d{3})(\d)/, "$1.$2");
        value = value.replace(/(\d{3})(\d)/, "$1.$2");
        value = value.replace(/(\d{3})(\d{1,2})$/, "$1-$2");

        input.value = value;
    });
}

// ===============================
// VALIDAÇÃO CPF
// ===============================
function validarCPF(cpf) {
    cpf = cpf.replace(/\D/g, "");

    if (cpf.length !== 11) return false;
    if (/^(\d)\1+$/.test(cpf)) return false;

    return true;
}

// ===============================
// USUÁRIO
// ===============================
function carregarUsuario(){

    tipoTexto.innerHTML = "Cadastro de Usuário";

    formulario.innerHTML = `

    <div class="input-box">
        <label>Nome</label>
        <input id="nome" type="text" placeholder="Digite seu nome">
    </div>

    <div class="input-box">
        <label>Email</label>
        <input id="email" type="email" placeholder="Digite seu email">
    </div>

    <div class="input-box">
        <label>CPF</label>
        <input id="cpf" type="text" placeholder="000.000.000-00">
    </div>

    <!-- ENDEREÇO COMPLETO -->
    <div class="input-box">
        <label>Rua</label>
        <input id="rua" type="text" placeholder="Nome da rua">
    </div>

    <div class="input-box">
        <label>Número</label>
        <input id="numero" type="text" placeholder="Número da casa">
    </div>

    <div class="input-box">
        <label>CEP</label>
        <input id="cep" type="text" placeholder="00000-000">
    </div>

    <div class="input-box">
        <label>Cidade</label>
        <input id="cidade" type="text" placeholder="Sua cidade">
    </div>

    <div class="input-box">
        <label>Criar Senha</label>
        <input id="senha" type="password" placeholder="Crie sua senha">
    </div>

    <div class="input-box">
        <label>Confirmar Senha</label>
        <input id="confirmarSenha" type="password" placeholder="Confirme sua senha">
    </div>

    <button class="btn" id="btnCadastrar">
        Cadastrar Usuário
    </button>

    <div class="extra">
        Não possui conta?
        <a href="../HTML/OpçãoLogin.html">Entrar</a>
    </div>
    `;

    const cpfInput = document.getElementById("cpf");
    const btn = document.getElementById("btnCadastrar");

    aplicarMascaraCPF(cpfInput);

    btn.addEventListener("click", (e) => {
        e.preventDefault();

        const nome = document.getElementById("nome").value.trim();
        const email = document.getElementById("email").value.trim();
        const cpf = cpfInput.value.trim();

        const rua = document.getElementById("rua").value.trim();
        const numero = document.getElementById("numero").value.trim();
        const cep = document.getElementById("cep").value.trim();
        const cidade = document.getElementById("cidade").value.trim();

        const senha = document.getElementById("senha").value;
        const confirmarSenha = document.getElementById("confirmarSenha").value;

        if (!nome || !email || !cpf || !rua || !numero || !cep || !cidade || !senha || !confirmarSenha) {
            alert("Preencha todos os campos!");
            return;
        }

        if (!validarCPF(cpf)) {
            alert("CPF inválido!");
            return;
        }

        if (senha !== confirmarSenha) {
            alert("As senhas não coincidem!");
            return;
        }

        alert("Cadastro realizado com sucesso!");
    });
}

// ===============================
// ADMIN
// ===============================
function carregarAdmin(){

    tipoTexto.innerHTML = "Cadastro de Administrador";

    formulario.innerHTML = `

    <div class="input-box">
        <label>Nome</label>
        <input type="text" placeholder="Digite seu nome">
    </div>

    <div class="input-box">
        <label>Email</label>
        <input type="email" placeholder="Digite seu email">
    </div>

    <div class="input-box">
        <label>Senha</label>
        <input type="password" placeholder="Digite sua senha">
    </div>

    <div class="input-box">
        <label>Nova Senha</label>
        <input type="password" placeholder="Digite a nova senha">
    </div>

    <button class="btn">
        Cadastrar Administrador
    </button>

    <div class="extra">
        Já possui conta?
        <a href="#">Entrar</a>
    </div>
    `;
}

// ===============================
// FUNCIONÁRIO
// ===============================
function carregarFuncionario(){

    tipoTexto.innerHTML = "Cadastro de Funcionário";

    formulario.innerHTML = `

    <div class="input-box">
        <label>Nome</label>
        <input type="text" placeholder="Digite seu nome">
    </div>

    <div class="input-box">
        <label>Email</label>
        <input type="email" placeholder="Digite seu email">
    </div>

    <div class="input-box">
        <label>Senha</label>
        <input type="password" placeholder="Digite sua senha">
    </div>

    <div class="input-box">
        <label>Nova Senha</label>
        <input type="password" placeholder="Digite a nova senha">
    </div>

    <button class="btn">
        Cadastrar Funcionário
    </button>

    <div class="extra">
        Já possui conta?
        <a href="#">Entrar</a>
    </div>
    `;
}

// ===============================
// BOTÕES
// ===============================
usuarioBtn.addEventListener("click", () => {
    removerActive();
    usuarioBtn.classList.add("active");
    carregarUsuario();
});

adminBtn.addEventListener("click", () => {
    removerActive();
    adminBtn.classList.add("active");
    carregarAdmin();
});

funcionarioBtn.addEventListener("click", () => {
    removerActive();
    funcionarioBtn.classList.add("active");
    carregarFuncionario();
});

// INICIAL
carregarUsuario();

</script>

</body>
</html>
