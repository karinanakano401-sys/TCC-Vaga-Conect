<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ParkEasy - Meus Carros</title>

    <link rel="stylesheet" href="../CSS/TelaVeiculos.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

<div class="container">

    <!-- Sidebar -->

    <aside class="sidebar">

          <div class="logo">
            <a href="TelaUsuario.html" class="logo">
            <i class="fa-solid fa-layer-group"></i>
            <span>Vaga</span>Connect
            </a>
        </div>

        <nav>

            <a href="../HTML/TelaUsuario.html">
                <i class="fa-solid fa-house"></i>
                Painel
            </a>

            <a class="ativo" href="#">
                <i class="fa-solid fa-car"></i>
                Meus Carros
            </a>

            <a href="../HTML/TelaConta.html">
                <i class="fa-solid fa-user"></i>
                Perfil
            </a>

             <a href="#" id="btnSair">
                <i class="fa-solid fa-right-from-bracket"></i
                    >Sair
            </a>

        </nav>

    </aside>

    <!-- Conteúdo -->

    <main class="conteudo">

        <h1>Meus Carros</h1>

        <p>
            Cadastre seus veículos para reservar mais rápido.
        </p>


        <!-- Card -->

        <section class="card">

            <h2>Adicionar novo carro</h2>

            <div class="linha">

                <div class="campo">

                    <label>Placa</label>

                    <input
                    type="text"
                    id="placa"
                    placeholder="ABC1D23">

                </div>

                <div class="campo">

                    <label>Modelo</label>

                    <input
                    type="text"
                    id="modelo"
                    placeholder="Ex.: Honda Civic">

                </div>

            </div>

            <button id="salvar">
                Salvar carro
            </button>

        </section>


        <!-- Lista -->

        <section class="lista">

            <h2>Meus carros cadastrados</h2>

            <table>

                <thead>

                    <tr>

                        <th>Placa</th>

                        <th>Modelo</th>

                        <th></th>

                    </tr>

                </thead>

                <tbody id="listaCarros">

                    <!-- O JS VAI CRIAR OS CARROS AQUI -->

                </tbody>

            </table>

        </section>

    </main>

</div>

<script src="../../Base/JS/sessao.js"></script>
<script>

// ===========================
// CAPTURANDO ELEMENTOS
// ===========================

const placa = document.getElementById("placa");
const modelo = document.getElementById("modelo");
const salvar = document.getElementById("salvar");
const lista = document.getElementById("listaCarros");

const api = "http://localhost:3333";

// ===========================
// USUÁRIO LOGADO
// ===========================

const usuarioLogado = JSON.parse(
    localStorage.getItem("usuarioLogado")
);

if(!usuarioLogado){

    window.location.replace("../../Base/HTML/OpçãoLogin.html");

}

// ===========================
// LISTA DE CARROS
// ===========================

let carros = [];

// ===========================
// CARREGAR CARROS DO USUÁRIO
// ===========================

async function carregarCarros(){

    try {

        const resposta = await fetch(api + "/carro");

        const todos = await resposta.json();

        if(!resposta.ok){
            throw new Error(todos.erro || "Erro ao carregar os carros");
        }

        carros = todos.filter(carro =>
            carro.fk_idCliente === usuarioLogado.id
        );

        mostrarCarros();

    } catch (error) {

        alert(error.message || "Não foi possível carregar os carros. Verifique se o servidor está ligado.");

    }

}

// ===========================
// MOSTRAR CARROS NA TABELA
// ===========================

function mostrarCarros(){

    lista.innerHTML = "";

    if(carros.length === 0){

        lista.innerHTML = `
            <tr>
                <td colspan="3">Nenhum carro cadastrado.</td>
            </tr>
        `;

        return;

    }

    carros.forEach(carro => {

        const tr = document.createElement("tr");

        tr.innerHTML = `

            <td>${carro.placacarro}</td>

            <td>${carro.modelo}</td>

            <td>

                <button class="excluir" data-id="${carro.id}">

                    <i class="fa-solid fa-trash"></i>

                </button>

            </td>

        `;

        lista.appendChild(tr);

    });

}

carregarCarros();

// ===========================
// ADICIONAR CARRO
// ===========================

salvar.addEventListener("click", async () => {

    const placaDigitada = placa.value.trim().toUpperCase();
    const modeloDigitado = modelo.value.trim();

    // Verifica se a placa foi preenchida

    if (placaDigitada === "") {

        alert("Digite a placa do veículo.");

        placa.focus();

        return;

    }

    // Verifica se o modelo foi preenchido

    if (modeloDigitado === "") {

        alert("Digite o modelo do veículo.");

        modelo.focus();

        return;

    }

    // Verifica se já existe

    const placaExiste = carros.some(carro => carro.placacarro === placaDigitada);

    if (placaExiste) {

        alert("Essa placa já está cadastrada.");

        return;

    }

    // Salva o carro

    salvar.disabled = true;

    try {

        const resposta = await fetch(api + "/carro", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                placacarro: placaDigitada,
                modelo: modeloDigitado,
                fk_idCliente: usuarioLogado.id
            })
        });

        const carro = await resposta.json();

        if(!resposta.ok){

            if((carro.erro || "").includes("Unique constraint")){
                throw new Error("Essa placa já está cadastrada.");
            }

            throw new Error(carro.erro || "Erro ao cadastrar o carro");

        }

        await carregarCarros();

        // Limpar campos

        placa.value = "";

        modelo.value = "";

        placa.focus();

    } catch (error) {

        alert(error.message || "Não foi possível cadastrar o carro. Verifique se o servidor está ligado.");

    } finally {

        salvar.disabled = false;

    }

});

// ===========================
// EXCLUIR CARRO
// ===========================

lista.addEventListener("click", async function(e){

    const botao = e.target.closest(".excluir");

    if(botao){

        const confirmar = confirm("Deseja excluir este carro?");

        if(confirmar){

            try {

                const resposta = await fetch(api + "/carro/" + botao.dataset.id, {
                    method: "DELETE"
                });

                const retorno = await resposta.json();

                if(!resposta.ok){
                    throw new Error(retorno.erro || "Erro ao excluir o carro");
                }

                await carregarCarros();

            } catch (error) {

                alert(error.message || "Não foi possível excluir o carro. Verifique se o servidor está ligado.");

            }

        }

    }

});


// ===============================
// SAIR DA CONTA
// ===============================

const btnSair = document.getElementById("btnSair");

btnSair.addEventListener("click", function (event) {

    event.preventDefault();

    const confirmar = confirm(
        "Tem certeza que deseja sair da sua conta?"
    );

    if (confirmar) {

        localStorage.removeItem("usuarioLogado");

        window.location.href = "../../Base/HTML/Abertura.html";

    }

});

/* =====================================================
   VagaConnect · tema.js

   Liga o modo claro em qualquer tela do sistema.
   O escuro continua sendo o padrão.

   COMO USAR
   Em cada tela, depois do CSS dela:


   A escolha fica salva no navegador e vale para todas
   as telas, sem precisar escolher de novo a cada página.
===================================================== */

(function(){

    "use strict";


    const CHAVE = "vagaconnect-tema";


    // aplica antes de desenhar, para a tela não piscar
    const salvo = localStorage.getItem(CHAVE);

    if(salvo === "claro"){

        document.documentElement.setAttribute("data-tema", "claro");

    }



    /* =================================================
       DESENHOS DO BOTÃO
    ================================================= */

    const sol = `
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="4.2"/>
            <path d="M12 2.5v2.2M12 19.3v2.2M4.2 4.2l1.6 1.6M18.2 18.2l1.6 1.6
                     M2.5 12h2.2M19.3 12h2.2M4.2 19.8l1.6-1.6M18.2 5.8l1.6-1.6"/>
        </svg>`;


    const lua = `
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5Z"/>
        </svg>`;



    /* =================================================
       BOTÃO
    ================================================= */

    function criarBotao(){

        if(document.querySelector(".tema-botao")) return;


        const botao = document.createElement("button");

        botao.className = "tema-botao";

        botao.type = "button";

        document.body.appendChild(botao);


        function pintar(){

            const claro = document.documentElement.getAttribute("data-tema") === "claro";

            botao.innerHTML = claro ? lua : sol;

            botao.title = claro ? "Mudar para o modo escuro" : "Mudar para o modo claro";

            botao.setAttribute("aria-label", botao.title);

            botao.setAttribute("aria-pressed", claro ? "true" : "false");

        }


        botao.addEventListener("click", () => {

            const claro = document.documentElement.getAttribute("data-tema") === "claro";


            if(claro){

                document.documentElement.removeAttribute("data-tema");

                localStorage.setItem(CHAVE, "escuro");

            } else {

                document.documentElement.setAttribute("data-tema", "claro");

                localStorage.setItem(CHAVE, "claro");

            }


            pintar();

        });


        pintar();

    }


    if(document.readyState === "loading"){

        document.addEventListener("DOMContentLoaded", criarBotao);

    } else {

        criarBotao();

    }



    /* =================================================
       ATALHO DE TECLADO: Shift + T
    ================================================= */

    document.addEventListener("keydown", (evento) => {

        if(evento.shiftKey && (evento.key === "T" || evento.key === "t")){

            const alvo = evento.target;

            const digitando = alvo && ["INPUT", "TEXTAREA", "SELECT"].includes(alvo.tagName);

            if(digitando) return;


            const botao = document.querySelector(".tema-botao");

            if(botao) botao.click();

        }

    });

})();
</script>

</body>
</html>
