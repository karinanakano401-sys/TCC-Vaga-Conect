<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">


<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>


<body>

<!-- CONTEÚDO -->


<main class="conteudo">


<div id="mensagem" style="display:none"></div>



<div class="topo">


<h1>

Escolha um Estacionamento

</h1>



<div class="pesquisa">


<i class="fa-solid fa-magnifying-glass"></i>



<input

type="text"

id="buscar"

placeholder="Pesquisar estacionamento..."

>


</div>



</div>





<!-- CARD 1 -->


<div class="estacionamento">


<div class="icone">

<i class="fa-solid fa-square-parking"></i>

</div>



<div class="info">

<div class="dados">

</span>



<span>

<i class="fa-solid fa-location-arrow"></i>

500 metros

</span>



</div>


</div>



<button class="selecionar">

Selecionar

</button>



</div>





<!-- CARD 2 -->


<div class="estacionamento">


<div class="icone">

<i class="fa-solid fa-square-parking"></i>

</div>



<div class="info">


<h2>

Shopping Park

</h2>



<p>

<i class="fa-solid fa-location-dot"></i>

Av. Brasil, 1000

</p>



<div class="dados">


<span>

<i class="fa-solid fa-car"></i>

18 vagas

</span>



<span>

<i class="fa-solid fa-location-arrow"></i>

1,2 km

</span>


</div>



</div>



<button class="selecionar">

Selecionar

</button>



</div>

<!-- CARD 3 -->


<div class="estacionamento">


<div class="icone">

<i class="fa-solid fa-square-parking"></i>

</div>



<div class="info">


<h2>

Estacionamento Central

</h2>



<p>

<i class="fa-solid fa-location-dot"></i>

Centro - Rua XV

</p>



<div class="dados">


<span>

<i class="fa-solid fa-car"></i>

56 vagas

</span>



<span>

<i class="fa-solid fa-location-arrow"></i>

850 metros

</span>


</div>



</div>



<button class="selecionar">

Selecionar

</button>



</div>



</main>


</div>

<script>


// ==============================
// ELEMENTOS
// ==============================


const campoPesquisa =
document.getElementById("buscar");


const cards =
document.querySelectorAll(".estacionamento");


const botoes =
document.querySelectorAll(".selecionar");


const mensagem =
document.getElementById("mensagem");





// ==============================
// PESQUISA
// ==============================


campoPesquisa.addEventListener("keyup",function(){


const texto =
this.value.toLowerCase();



cards.forEach(card=>{


const nome =
card.querySelector("h2")
.textContent
.toLowerCase();



const endereco =
card.querySelector("p")
.textContent
.toLowerCase();




if(
nome.includes(texto) ||
endereco.includes(texto)
){


card.style.display="flex";


}else{


card.style.display="none";


}



});



});







// ==============================
// SELECIONAR ESTACIONAMENTO
// ==============================


botoes.forEach(botao=>{


botao.addEventListener("click",function(){



// remove seleção antiga


cards.forEach(card=>{


card.classList.remove("selecionado");


card.querySelector(".selecionar")
.innerHTML="Selecionar";


});






// pega card escolhido


const card =
this.closest(".estacionamento");



card.classList.add("selecionado");



this.innerHTML =
"✔ Selecionado";






// pega informações


const nome =
card.querySelector("h2")
.innerText;



const endereco =
card.querySelector("p")
.innerText;







// ==============================
// SALVAR ESCOLHA
// ==============================



const estacionamento = {


nome:nome,


endereco:endereco


};





// usado pela TelaReservas


localStorage.setItem(

"estacionamentoSelecionado",

JSON.stringify(estacionamento)

);





// compatibilidade com outras telas


localStorage.setItem(

"estacionamento",

nome

);



localStorage.setItem(

"endereco",

endereco

);








// mensagem


mensagem.style.display="block";



mensagem.innerHTML=`

✔ Estacionamento

<strong>${nome}</strong>

selecionado com sucesso.

`;



});

});

// ==============================
// CARREGAR ESTACIONAMENTO SALVO
// ==============================


window.addEventListener("load",()=>{



const estacionamentoSalvo =

JSON.parse(

localStorage.getItem("estacionamentoSelecionado")

);





if(!estacionamentoSalvo){

    return;

}






cards.forEach(card=>{



const nomeCard =

card.querySelector("h2")
.innerText;





if(nomeCard === estacionamentoSalvo.nome){



card.classList.add("selecionado");



card.querySelector(".selecionar")
.innerHTML="✔ Selecionado";





mensagem.style.display="block";



mensagem.innerHTML=`

✔ Estacionamento

<strong>${estacionamentoSalvo.nome}</strong>

já está selecionado.

`;



}



});



});





</script>


</body>

</html>
