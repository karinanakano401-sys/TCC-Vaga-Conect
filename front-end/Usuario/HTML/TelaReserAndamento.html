(function(){

    const css = document.createElement("style");

    css.textContent = `

    /* =====================================================

    .prorrogacao-info span{

    @media (prefers-reduced-motion:reduce){

        .vc-fundo,

    document.head.appendChild(css);


    const tons = {

        perigo: {
            c:"#f87171",
            f:"rgba(248,113,113,.13)",
            s:"!"
        },

        aviso: {
            c:"#fbbf24",
            f:"rgba(251,191,36,.13)",
            s:"?"
        },

        azul: {
            c:"#6fb4ff",
            f:"rgba(111,180,255,.13)",
            s:"?"
        },

        sucesso: {
            c:"#34d399",
            f:"rgba(52,211,153,.13)",
            s:"✓"
        }

    };


    /* confirmar({ titulo, texto, sim, nao, tom }) devolve uma Promise */

    window.confirmar = function(op){

        op = op || {};

        const tom = tons[op.tom] || tons.aviso;


        return new Promise(function(responder){

            const fundo = document.createElement("div");

            fundo.className = "vc-fundo";

            fundo.style.setProperty("--c", tom.c);

            fundo.style.setProperty("--f", tom.f);

            fundo.innerHTML = `
                <div
                    class="vc-modal"
                    role="dialog"
                    aria-modal="true"
                    aria-labelledby="vcTit">

                    <div
                        class="vc-simbolo"
                        aria-hidden="true">
                        ${op.simbolo || tom.s}
                    </div>

                    <h3 id="vcTit"></h3>

                    <p></p>

                    <div class="vc-botoes">

                        <button
                            class="vc-nao"
                            type="button">
                        </button>

                        <button
                            class="vc-sim"
                            type="button">
                        </button>

                    </div>

                </div>`;


            fundo.querySelector("h3").textContent =
                op.titulo || "Tem certeza?";


            fundo.querySelector("p").textContent =
                op.texto || "";


            const naoBtn =
                fundo.querySelector(".vc-nao");


            const simBtn =
                fundo.querySelector(".vc-sim");


            naoBtn.textContent =
                op.nao || "Voltar";


            simBtn.textContent =
                op.sim || "Confirmar";


            const focoAnterior =
                document.activeElement;


            document.body.appendChild(fundo);


            requestAnimationFrame(() =>
                fundo.classList.add("on")
            );


            naoBtn.focus();


            function fechar(valor){

                fundo.classList.remove("on");

                setTimeout(
                    () => fundo.remove(),
                    200
                );

                document.removeEventListener(
                    "keydown",
                    tecla
                );


                if(
                    focoAnterior &&
                    focoAnterior.focus
                ){
                    focoAnterior.focus();
                }


                responder(valor);

            }


            function tecla(e){

                if(e.key === "Escape"){
                    fechar(false);
                }

            }


            document.addEventListener(
                "keydown",
                tecla
            );


            naoBtn.onclick =
                () => fechar(false);


            simBtn.onclick =
                () => fechar(true);


            fundo.onclick =
                (e) => {

                    if(e.target === fundo){
                        fechar(false);
                    }

                };

        });

    };


    /* avisos no lugar do alert */

    const caixa = document.createElement("div");

    caixa.className = "vc-avisos";

    caixa.setAttribute("role","status");

    caixa.setAttribute("aria-live","polite");

    document.body.appendChild(caixa);


    const regras = [

        {
            re:/prorrogada/i,
            t:"sucesso",
            tit:"Reserva prorrogada",
            txt:"Sua saída prevista foi adiada em 1 hora."
        },

        {
            re:/já usou a prorrogação/i,
            t:"aviso",
            tit:"Prorrogação já usada",
            txt:"Cada reserva pode ser prorrogada uma vez só."
        },

        {
            re:/cancelada e vaga liberada/i,
            t:"sucesso",
            tit:"Reserva cancelada",
            txt:"A vaga voltou a ficar disponível."
        },

        {
            re:/nenhuma reserva em andamento/i,
            t:"aviso",
            tit:"Nada para prorrogar",
            txt:"Você não tem reserva em andamento no momento."
        },

        {
            re:/abrindo a tela de reembolso/i,
            t:"azul",
            tit:"Reembolso",
            txt:"Abrindo a tela para você confirmar o cancelamento..."
        },

        {
            re:/chegada já foi confirmada/i,
            t:"aviso",
            tit:"Chegada confirmada",
            txt:"Os minutos já usados são cobrados. O restante da vaga volta no reembolso."
        },

        {
            re:/não foi possível prorrogar/i,
            t:"perigo",
            tit:"Não deu para prorrogar"
        },

        {
            re:/não foi possível cancelar/i,
            t:"perigo",
            tit:"Não deu para cancelar"
        },

        {
            re:/erro|servidor/i,
            t:"perigo",
            tit:"Problema com o servidor",
            txt:"Confira se o back-end está rodando em localhost:3333."
        }

    ];


    window.alert = function(msg){

        const r =
            regras.find(
                x => x.re.test(String(msg))
            ) || {};


        const tom =
            tons[r.t] || tons.azul;


        const tempo =
            r.t === "perigo"
                ? 6000
                : 4200;


        const el =
            document.createElement("div");


        el.className = "vc-aviso";


        el.style.setProperty(
            "--c",
            tom.c
        );


        el.innerHTML = `
            <b></b>
            <span></span>

            <div
                class="vc-barra"
                style="animation-duration:${tempo}ms">
            </div>`;


        el.querySelector("b").textContent =
            r.tit || "VagaConnect";


        el.querySelector("span").textContent =
            r.txt || String(msg);


        function fechar(){

            el.classList.remove("on");

            setTimeout(
                () => el.remove(),
                220
            );

        }


        el.onclick = fechar;


        caixa.appendChild(el);


        requestAnimationFrame(() =>
            el.classList.add("on")
        );


        let t =
            setTimeout(
                fechar,
                tempo
            );


        el.addEventListener(
            "mouseenter",
            () => clearTimeout(t)
        );


        el.addEventListener(
            "mouseleave",
            () => {

                t = setTimeout(
                    fechar,
                    1500
                );

            }
        );


        while(caixa.children.length > 3){

            caixa.firstElementChild.remove();

        }

    };

})();



// =====================================================
// CONFIGURAÇÃO
// =====================================================


const api =
    "http://localhost:3333";


const usuarioLogado =
    JSON.parse(
        localStorage.getItem("usuarioLogado")
    );


if(!usuarioLogado){

    window.location.replace(
        "../../Base/HTML/OpçãoLogin.html"
    );

}



// =====================================================
// ELEMENTOS
// =====================================================


const listaReservas =
    document.getElementById("listaReservas");


const voltar =
    document.getElementById("voltar");


const btnProrrogar =
    document.getElementById("prorrogar");



let reservas = [];

let contador = null;

let relogioAtraso = null;

let sincroniaAtraso = null;

let recarregandoAtraso = false;

let reembolsos = [];



// =====================================================
// AJUDANTES
// =====================================================


function mostrarPreco(valor){

    return Cobranca.mostrarPreco(valor);

}



function mostrarDataHora(texto){

    if(!texto) return "--";


    const data =
        new Date(texto);


    const dia =
        String(
            data.getDate()
        ).padStart(2,"0");


    const mes =
        String(
            data.getMonth() + 1
        ).padStart(2,"0");


    const hora =
        String(
            data.getHours()
        ).padStart(2,"0");


    const minuto =
        String(
            data.getMinutes()
        ).padStart(2,"0");


    return `${dia}/${mes}/${data.getFullYear()} - ${hora}:${minuto}`;

}



function formatar(valor){

    return String(valor).padStart(
        2,
        "0"
    );

}



function totalPago(reservaCli){

    return reservaCli.pagamentos.reduce(
        (soma, pagamento) =>
            soma + pagamento.valor,
        0
    );

}



function estaAtiva(item){

    const status =
        item.reserva.status;


    return status !== "Cancelada" &&
           status !== "Concluída";

}



function classeDoStatus(status){

    if(status === "Cancelada")
        return "cancelada";


    if(status === "Concluída")
        return "concluida";


    if(status === "Tolerância")
        return "tolerancia";


    if(status === "Atraso")
        return "atraso";


    return "";

}



function textoTempoRestante(ms){

    if(ms <= 0) return "0 min";

    const total = Math.ceil(ms / 60000);

    if(total < 60) return total + " min";

    const horas = Math.floor(total / 60);

    const minutos = total % 60;

    return minutos === 0
        ? horas + "h"
        : horas + "h " + String(minutos).padStart(2, "0") + "min";

}



function htmlFaixaChegada(item){

    const fase = Cobranca.faseChegada(item);

    if(!fase) return "";

    if(fase.fase === "Reservada"){

        return `

            <div class="faixa-atraso tolerancia">

                <i class="fa-solid fa-clock"></i>

                <div>

                    <strong>Aguardando horário de chegada</strong>

                    <span class="atraso-restante" data-fase="Reservada" data-ate="${fase.ate.toISOString()}">
                        Faltam ${textoTempoRestante(fase.ate - Date.now())} para o horário marcado.
                    </span>

                </div>

            </div>

        `;

    }

    if(fase.fase === "Tolerância"){

        return `

            <div class="faixa-atraso tolerancia">

                <i class="fa-solid fa-hourglass-half"></i>

                <div>

                    <strong>Tolerância de 10 minutos</strong>

                    <span class="atraso-restante" data-fase="Tolerância" data-ate="${fase.ate.toISOString()}">
                        Confirme a presença em até ${textoTempoRestante(fase.ate - Date.now())}.
                    </span>

                </div>

            </div>

        `;

    }

    if(fase.fase === "Atraso"){

        return `

            <div class="faixa-atraso atraso">

                <i class="fa-solid fa-triangle-exclamation"></i>

                <div>

                    <strong>Atraso</strong>

                    <span class="atraso-restante" data-fase="Atraso" data-ate="${fase.ate.toISOString()}">
                        A vaga será cancelada em ${textoTempoRestante(fase.ate - Date.now())}.
                    </span>

                </div>

            </div>

        `;

    }

    return `

        <div class="faixa-atraso atraso">

            <i class="fa-solid fa-ban"></i>

            <div>

                <strong>Não compareceu</strong>

                <span>A reserva será cancelada automaticamente.</span>

            </div>

        </div>

    `;

}



function distanciaDoHorario(item){

    return Math.abs(
        new Date(item.hora).getTime()
        - Date.now()
    );

}



// =====================================================
// PRORROGAÇÃO ÚNICA
// Cada reserva só pode ser prorrogada uma vez.
// O controle fica guardado no navegador.
// =====================================================


function listaProrrogadas(){

    return JSON.parse(
        localStorage.getItem(
            "prorrogacoesUsadas"
        ) || "[]"
    );

}



function jaProrrogou(idReservaCli){

    return listaProrrogadas()
        .includes(idReservaCli);

}



function marcarProrrogada(idReservaCli){

    const usadas =
        listaProrrogadas();


    if(!usadas.includes(idReservaCli)){

        usadas.push(idReservaCli);


        localStorage.setItem(
            "prorrogacoesUsadas",
            JSON.stringify(usadas)
        );

    }

}



// =====================================================
// REEMBOLSOS
// =====================================================


// lê os pedidos da API; se a rota não existir,
// usa o navegador

async function carregarReembolsos(){

    try {

        const resposta =
            await fetch(
                api + "/reembolso"
            );


        if(!resposta.ok)
            throw new Error("sem endpoint");


        reembolsos =
            await resposta.json();


    } catch(error){

        reembolsos =
            JSON.parse(
                localStorage.getItem(
                    "reembolsos"
                ) || "[]"
            );

    }


    reembolsos =
        reembolsos.filter(
            p =>
                p.fk_idCliente ===
                usuarioLogado.id
        );

}



function reembolsoDaReserva(idReservaCli){

    return reembolsos.find(
        p =>
            p.fk_reservacli ===
            idReservaCli
    ) || null;

}



// =====================================================
// BUSCAR AS RESERVAS DO CLIENTE
// =====================================================


async function carregarReservas(){

    try {

        const resposta =
            await fetch(
                api + "/reservacli"
            );


        const lista =
            await resposta.json();


        if(!resposta.ok){

            throw new Error(
                lista.erro ||
                "Erro ao carregar suas reservas"
            );

        }



        // Ativas primeiro; entre elas,
        // a mais perto do horário de entrada

        reservas =
            lista

            .filter(
                item =>
                    item.fk_idCliente ===
                    usuarioLogado.id
            )

            .sort((a,b) => {

                const ativaA =
                    estaAtiva(a);


                const ativaB =
                    estaAtiva(b);


                if(ativaA !== ativaB){

                    return ativaA
                        ? -1
                        : 1;

                }


                return (
                    distanciaDoHorario(a) -
                    distanciaDoHorario(b)
                );

            });



        await carregarReembolsos();


        render();


        pintarReembolsos();


        atualizarBotaoProrrogar();


        if(!sincroniaAtraso){

            sincroniaAtraso =
                setInterval(
                    carregarReservas,
                    20000
                );

        }


    } catch(error){

        listaReservas.innerHTML = `
            <p class="carregando">
                ${
                    error.message ||
                    "Não foi possível carregar. Verifique se o servidor está ligado."
                }
            </p>
        `;

    }

}



// =====================================================
// DESENHAR OS CARDS
// =====================================================


function render(){

    if(contador){

        clearInterval(contador);

        contador = null;

    }


    if(relogioAtraso){

        clearInterval(relogioAtraso);

        relogioAtraso = null;

    }



    if(reservas.length === 0){

        listaReservas.innerHTML = `

            <p class="carregando">
                Você ainda não tem reservas.
            </p>

            <button
                class="extend"
                onclick="window.location.href='TelaReservas.html'">

                Reservar uma vaga

            </button>

        `;


        return;

    }



    listaReservas.innerHTML =
        reservas.map(
            (item, indice) => {

        const reserva =
            item.reserva;


        const vaga =
            reserva.vaga;


        const privilegiada =
            indice === 0 &&

// =====================================================
// CONTADOR DA RESERVA EM ANDAMENTO
// =====================================================


function iniciarTimer(){

    const timer =
        document.getElementById(
            "timer"
        );


    const tituloTimer =
        document.getElementById(
            "tituloTimer"
        );


    if(!timer)
        return;



    /*
     * A primeira reserva ativa é a reserva
     * que possui o cronômetro.
     */

    const reservaAtiva =
        reservas[0];


    if(!reservaAtiva)
        return;



    const chegada =
        new Date(
            reservaAtiva.hora
        );


    const saida =
        reservaAtiva.horaSaida
            ? new Date(
                reservaAtiva.horaSaida
            )
            : chegada;



    function atualizar(){

        const agora =
            new Date();



        /*
         * Antes da hora marcada:
         * conta até a chegada.
         *
         * Depois da chegada:
         * conta até a hora de saída.
         *
         * Como a hora de saída foi aumentada
         * em 1 hora na prorrogação, este mesmo
         * cronômetro automaticamente passa a
         * contar até o novo horário.
         */

        const alvo =
            agora < chegada
                ? chegada
                : saida;



        tituloTimer.textContent =
            agora < chegada
                ? "Tempo até a chegada"
                : "Tempo restante";



        let segundos =
            Math.floor(
                (alvo - agora) / 1000
            );



        if(segundos <= 0){

            timer.textContent =
                "00 : 00 : 00";


            tituloTimer.textContent =
                "Tempo esgotado";


            clearInterval(contador);

            contador = null;


            return;

        }



        const horas =
            Math.floor(
                segundos / 3600
            );


        const minutos =
            Math.floor(
                (segundos % 3600) / 60
            );


        const resto =
            segundos % 60;



        timer.textContent =
            `${formatar(horas)} : ` +
            `${formatar(minutos)} : ` +
            `${formatar(resto)}`;

    }



    atualizar();


    contador =
        setInterval(
            atualizar,
            1000
        );

}



function mensagemRestante(fase, ms){

    const tempo = textoTempoRestante(ms);

    if(fase === "Atraso")
        return "A vaga será cancelada em " + tempo + ".";

    if(fase === "Tolerância")
        return "Confirme a presença em até " + tempo + ".";

    return "Faltam " + tempo + " para o horário marcado.";

}



function iniciarRelogioAtraso(){

    const spans =
        document.querySelectorAll(
            ".atraso-restante"
        );


    if(!spans.length)
        return;


    function atualizarFaixas(){

        let recarregar = false;

        spans.forEach(span => {

            if(!span.dataset.ate) return;

            const ate = new Date(span.dataset.ate);

            const ms = ate.getTime() - Date.now();

            span.textContent =
                mensagemRestante(
                    span.dataset.fase,
                    ms
                );

            if(ms <= 0) recarregar = true;

        });


        if(recarregar && !recarregandoAtraso){

            recarregandoAtraso = true;

            carregarReservas()
                .finally(() => {
                    recarregandoAtraso = false;
                });

        }

    }


    atualizarFaixas();


    relogioAtraso =
        setInterval(
            atualizarFaixas,
            1000
        );

}



// =====================================================
// CONFIRMAR PRESENÇA · só na vaga ainda reservada
// =====================================================


function confirmarPresenca(idReservaCli){

    const reservaCli =
        reservas.find(
            item =>
                item.id ===
                idReservaCli
        );


    if(!reservaCli)
        return;


    if(!Cobranca.aguardandoChegada(reservaCli.reserva.status)){

        alert(
            "Só é possível confirmar presença em uma reserva que ainda está aguardando sua chegada."
        );

        return;

    }


    Presenca.modalCliente({
        id: idReservaCli,
        aoConfirmar: carregarReservas
    });

}



// =====================================================
// PRORROGAR
// Soma exatamente 1 hora na saída prevista.
// Só pode ser usada uma vez por reserva.
// =====================================================


async function prorrogar(idReservaCli){

    const reservaCli =
        reservas.find(
            item =>
                item.id ===
                idReservaCli
        );


    if(!reservaCli)
        return;



    if(jaProrrogou(idReservaCli)){

        alert(
            "Você já usou a prorrogação dessa reserva."
        );


        return;

    }



    const ok =
        await confirmar({

            tom:"azul",

            titulo:
                "Prorrogar por 1 hora?",

            texto:
                "Atenção: cada reserva pode " +
                "ser prorrogada uma única vez. " +
                "A saída prevista será adiada " +
                "em uma hora.",

            nao:
                "Agora não",

            sim:
                "Prorrogar"

        });



    if(!ok)
        return;



    /*
     * =================================================
     * NOVA SAÍDA
     *
     * Pega a hora de saída atual e adiciona
     * exatamente 1 hora.
     * =================================================
     */

    const novaSaida =
        new Date(
            reservaCli.horaSaida ||
            reservaCli.hora
        );


    novaSaida.setHours(
        novaSaida.getHours() + 1
    );



    try {

        /*
         * Envia a nova hora para o backend.
         */

        const resposta =
            await fetch(
                api +
                "/reservacli/" +
                idReservaCli,
                {

                    method:"PUT",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:JSON.stringify({

                        data:
                            reservaCli.data,

                        hora:
                            reservaCli.hora,

                        /*
                         * A nova saída contém
                         * a hora original + 1 hora.
                         */

                        horaSaida:
                            novaSaida.toISOString(),

                        fk_idCliente:
                            reservaCli.fk_idCliente,

                        fk_idReserva:
                            reservaCli.fk_idReserva,

                        fk_idCarro:
                            reservaCli.fk_idCarro

                    })

                }
            );



        const retorno =
            await resposta.json();



        if(!resposta.ok){

            throw new Error(
                retorno.erro ||
                "Erro ao prorrogar a reserva"
            );

        }



        /*
         * =================================================
         * ATUALIZA IMEDIATAMENTE O OBJETO LOCAL
         *
         * Isso faz com que o cronômetro já passe
         * a utilizar a nova saída sem precisar
         * esperar outra busca no servidor.
         * =================================================
         */

        reservaCli.horaSaida =
            novaSaida.toISOString();



        /*
         * Marca que esta reserva já utilizou
         * a única prorrogação permitida.
         */

        marcarProrrogada(
            idReservaCli
        );



        /*
         * Mostra a confirmação para o usuário.
         */

        alert(
            "Reserva prorrogada por mais 1 hora!"
        );



        /*
         * =================================================
         * REDESENHA A TELA
         *
         * O render():
         *
         * 1. mostra "Prorrogação realizada";
         * 2. muda o botão;
         * 3. atualiza a saída prevista;
         * 4. chama iniciarTimer();
         *
         * Portanto o cronômetro começa a contar
         * usando a nova hora de saída.
         * =================================================
         */

        render();



        /*
         * Atualiza também o botão da lateral.
         */

        atualizarBotaoProrrogar();



    } catch(error){

        alert(
            error.message ||
            "Não foi possível prorrogar a reserva."
        );

    }

}

function atualizarBotaoProrrogar(){

    const ativa =
        reservas.find(
            item =>
                estaAtiva(item)
        );


    const pode =
        Boolean(ativa) &&
        !jaProrrogou(
            ativa.id
        );


    btnProrrogar.disabled =
        !pode;


    btnProrrogar.style.opacity =
        pode
            ? "1"
            : ".55";


    btnProrrogar.style.cursor =
        pode
            ? "pointer"
            : "not-allowed";



    btnProrrogar.innerHTML =
        (
            ativa &&
            jaProrrogou(
                ativa.id
            )
        )

        ? `
            <i class="fa-solid fa-check"></i>
            Prorrogação já usada
          `

        : `
            <i class="fa-solid fa-clock-rotate-left"></i>
            Solicitar prorrogação
          `;

}



// =====================================================
// CANCELAR · leva para a tela de reembolso
// =====================================================


async function cancelar(idReservaCli){

    const reservaCli =
        reservas.find(
            item =>
                item.id ===
                idReservaCli
        );


    if(!reservaCli)
        return;



    if(
        reservaCli.reserva.status !==
        "Reservada" &&
        reservaCli.reserva.status !==
        "Tolerância" &&
        reservaCli.reserva.status !==
        "Atraso" &&
        reservaCli.reserva.status !==
        "Ativa"
    ){

        alert(
            "Esta reserva já foi encerrada. Não é possível cancelar com reembolso."
        );


        return;

    }



    const conta =
        Cobranca.calcularUso(
            reservaCli
        );


    const pago =
        conta.pago;


    const volta =
        conta.reembolso;



    const ok =
        await confirmar({

            tom:"aviso",

            titulo:
                "Cancelar e pedir reembolso?",

            texto:
                conta.minutosUsados === 0
                    ? `Você pagou ${mostrarPreco(pago)} nessa reserva e ainda não usou a vaga. ` +
                      `Na próxima tela, o funcionário passa um código de saída para confirmar o estorno de ${mostrarPreco(volta)}.`
                    : `Você já usou ${Cobranca.mostrarDuracao(conta.minutosUsados)} ` +
                      `(${mostrarPreco(conta.valorUsado)}). ` +
                      `Na próxima tela, o funcionário passa um código de saída para confirmar o estorno de ${mostrarPreco(volta)}.`,

            nao:
                "Manter reserva",

            sim:
                "Ir para o reembolso"

        });



    if(!ok)
        return;



    alert(
        "Abrindo a tela de reembolso..."
    );



    localStorage.setItem(
        "reservaParaCancelar",
        idReservaCli
    );



    setTimeout(
        () => {

            window.location.href =
                "TelaReembolso.html?id=" +
                idReservaCli;

        },
        900
    );

}

/* =====================================================
   VagaConnect · tema.js

   Liga o modo claro em qualquer tela do sistema.
   O escuro continua sendo o padrão.

   COMO USAR
   Em cada tela, depois do CSS dela:


   A escolha fica salva no navegador e vale para todas
   as telas, sem precisar escolher de novo a cada página.
===================================================== */

(function(){

    "use strict";


    const CHAVE = "vagaconnect-tema";


    // aplica antes de desenhar, para a tela não piscar
    const salvo = localStorage.getItem(CHAVE);

    if(salvo === "claro"){

        document.documentElement.setAttribute("data-tema", "claro");

    }



    /* =================================================
       DESENHOS DO BOTÃO
    ================================================= */

    const sol = `
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="4.2"/>
            <path d="M12 2.5v2.2M12 19.3v2.2M4.2 4.2l1.6 1.6M18.2 18.2l1.6 1.6
                     M2.5 12h2.2M19.3 12h2.2M4.2 19.8l1.6-1.6M18.2 5.8l1.6-1.6"/>
        </svg>`;


    const lua = `
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5Z"/>
        </svg>`;



    /* =================================================
       BOTÃO
    ================================================= */

    function criarBotao(){

        if(document.querySelector(".tema-botao")) return;


        const botao = document.createElement("button");

        botao.className = "tema-botao";

        botao.type = "button";

        document.body.appendChild(botao);


        function pintar(){

            const claro = document.documentElement.getAttribute("data-tema") === "claro";

            botao.innerHTML = claro ? lua : sol;

            botao.title = claro ? "Mudar para o modo escuro" : "Mudar para o modo claro";

            botao.setAttribute("aria-label", botao.title);

            botao.setAttribute("aria-pressed", claro ? "true" : "false");

        }


        botao.addEventListener("click", () => {

            const claro = document.documentElement.getAttribute("data-tema") === "claro";


            if(claro){

                document.documentElement.removeAttribute("data-tema");

                localStorage.setItem(CHAVE, "escuro");

            } else {

                document.documentElement.setAttribute("data-tema", "claro");

                localStorage.setItem(CHAVE, "claro");

            }


            pintar();

        });


        pintar();

    }


    if(document.readyState === "loading"){

        document.addEventListener("DOMContentLoaded", criarBotao);

    } else {

        criarBotao();

    }



    /* =================================================
       ATALHO DE TECLADO: Shift + T
    ================================================= */

    document.addEventListener("keydown", (evento) => {

        if(evento.shiftKey && (evento.key === "T" || evento.key === "t")){

            const alvo = evento.target;

            const digitando = alvo && ["INPUT", "TEXTAREA", "SELECT"].includes(alvo.tagName);

            if(digitando) return;


            const botao = document.querySelector(".tema-botao");

            if(botao) botao.click();

        }

    });

})();

</script>
