<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Minha Conta - VagaConnect</title>

  <link rel="stylesheet" href="../CSS/TelaConta.css" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>

  <div class="container">

    <div class="card">

      <div class="top-bar">
        <button type="button" class="back-button" id="voltar">←</button>
        <span>MINHA CONTA</span>
      </div>

        <div class="logo">
          <a href="TelaUsuario.html" class="logo">
            <i class="fa-solid fa-layer-group"></i>
            <span>Vaga</span>Connect
            </a>
        </div>

      <h2>Editar dados da conta</h2>
      <p class="subtitle">Atualize suas informações pessoais</p>

      <form id="formConta">

        <label>Nome completo</label>
        <input type="text" id="nome" placeholder="Seu nome completo" required>

        <div class="row">
          <div>
            <label>CPF</label>
            <input type="text" id="cpf" readonly>
          </div>

          <div>
            <label>E-mail</label>
            <input type="email" id="email" readonly>
          </div>
        </div>

        <label>Data de nascimento</label>
        <input type="date" id="dataNascimento" required>

        <label>CEP</label>
        <input type="text" id="cep" placeholder="00000-000" maxlength="9" required>

        <div class="row">
          <div>
            <label>Número</label>
            <input type="text" id="numero" placeholder="Ex.: 123" required>
          </div>

          <div>
            <label>Estado</label>
            <input type="text" id="estado" placeholder="UF (ex.: SP)" maxlength="2" required>
          </div>
        </div>

        <label>Rua</label>
        <input type="text" id="rua" placeholder="Ex.: Rua das Flores" required>

        <label>Bairro</label>
        <input type="text" id="bairro" placeholder="Ex.: Centro" required>

        <label>Cidade</label>
        <input type="text" id="cidade" placeholder="Ex.: Santa Fé do Sul" required>

        <label>Nova senha</label>
        <div class="password-box">
          <input type="password" id="senha1" placeholder="Deixe em branco para manter">
          <span onclick="togglePassword('senha1')">👁</span>
        </div>

        <label>Confirmar senha</label>
        <div class="password-box">
          <input type="password" id="senha2" placeholder="Confirme a nova senha">
          <span onclick="togglePassword('senha2')">👁</span>
        </div>

        <button type="submit" id="salvar">Salvar alterações</button>

      </form>

    </div>

  </div>

  <script src="../../Base/JS/sessao.js"></script>
  <script src="../../Base/JS/cep.js"></script>
  <script>
    const api = "http://localhost:3333";

    const usuarioLogado = JSON.parse(
      localStorage.getItem("usuarioLogado")
    );

    if (!usuarioLogado) {
      window.location.replace("../../Base/HTML/OpçãoLogin.html");
    }

    let usuarioAtual = null;

    const formulario = document.getElementById("formConta");
    const botaoSalvar = document.getElementById("salvar");


    function togglePassword(id) {
      const input = document.getElementById(id);
      input.type = input.type === "password" ? "text" : "password";
    }


    function validarMaiorDe18(dataNascimento) {
      if (!dataNascimento) return false;

      const nascimento = new Date(dataNascimento + "T00:00:00");
      const hoje = new Date();
      let idade = hoje.getFullYear() - nascimento.getFullYear();
      const mes = hoje.getMonth() - nascimento.getMonth();

      if (mes < 0 || (mes === 0 && hoje.getDate() < nascimento.getDate())) {
        idade--;
      }

      return idade >= 18;
    }


    async function carregarConta() {
      try {
        const resposta = await fetch(api + "/usuario/" + usuarioLogado.id);
        const usuario = await resposta.json();

        if (!resposta.ok || !usuario) {
          throw new Error(usuario.erro || "Não foi possível carregar seus dados.");
        }

        usuarioAtual = usuario;

        document.getElementById("nome").value = usuario.nome;
        document.getElementById("cpf").value = usuario.cpf;
        document.getElementById("email").value = usuario.email;
        document.getElementById("dataNascimento").value =
          usuario.dataNascimento.substring(0, 10);

        const endereco = usuario.endereco || {};

        document.getElementById("rua").value = endereco.rua || "";
        document.getElementById("numero").value = endereco.numero || "";
        document.getElementById("cep").value = Cep.formatar(endereco.cep || "");
        document.getElementById("bairro").value = endereco.bairro || "";
        document.getElementById("cidade").value = endereco.cidade || "";
        document.getElementById("estado").value = endereco.estado || "";
      } catch (error) {
        alert(error.message || "Não foi possível carregar. Verifique se o servidor está ligado.");
      }
    }


    formulario.addEventListener("submit", async (event) => {
      event.preventDefault();

      if (!usuarioAtual) return;

      const nome = document.getElementById("nome").value.trim();
      const dataNascimento = document.getElementById("dataNascimento").value;
      const rua = document.getElementById("rua").value.trim();
      const numero = document.getElementById("numero").value.trim();
      const cep = document.getElementById("cep").value.trim();
      const bairro = document.getElementById("bairro").value.trim();
      const cidade = document.getElementById("cidade").value.trim();
      const estado = document.getElementById("estado").value.trim().toUpperCase();
      const senha1 = document.getElementById("senha1").value;
      const senha2 = document.getElementById("senha2").value;

      if (!nome || !dataNascimento || !rua || !numero || !cep || !bairro || !cidade || !estado) {
        alert("Preencha todos os campos obrigatórios.");
        return;
      }

      if (!validarMaiorDe18(dataNascimento)) {
        alert("É necessário ter 18 anos ou mais.");
        return;
      }

      if (senha1 || senha2) {
        if (senha1 !== senha2) {
          alert("As senhas não coincidem.");
          return;
        }

        if (senha1.length < 3) {
          alert("A nova senha precisa ter pelo menos 3 caracteres.");
          return;
        }
      }

      botaoSalvar.disabled = true;

      try {
        const respostaEndereco = await fetch(api + "/endereco/" + usuarioAtual.fk_idEndereco, {
          method: "PUT",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            rua,
            numero,
            bairro,
            cidade,
            estado,
            cep
          })
        });

        const endereco = await respostaEndereco.json();

        if (!respostaEndereco.ok) {
          throw new Error(endereco.erro || "Erro ao atualizar o endereço");
        }

        const dadosUsuario = {
          nome,
          dataNascimento,
          cpf: usuarioAtual.cpf,
          email: usuarioAtual.email
        };

        if (senha1) {
          dadosUsuario.senha = senha1;
        }

        const respostaUsuario = await fetch(api + "/usuario/" + usuarioAtual.id, {
          method: "PUT",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify(dadosUsuario)
        });

        const usuario = await respostaUsuario.json();

        if (!respostaUsuario.ok) {
          if ((usuario.erro || "").includes("Unique constraint")) {
            throw new Error("Já existe um usuário com esse e-mail ou CPF.");
          }

          throw new Error(usuario.erro || "Erro ao atualizar o usuário");
        }

        localStorage.setItem("usuarioLogado", JSON.stringify({
          ...usuarioLogado,
          nome: usuario.nome,
          email: usuario.email,
          dataNascimento: usuario.dataNascimento
        }));

        document.getElementById("senha1").value = "";
        document.getElementById("senha2").value = "";

        usuarioAtual = usuario;

        alert("Dados atualizados com sucesso!");
      } catch (error) {
        alert(error.message || "Não foi possível salvar. Verifique se o servidor está ligado.");
      } finally {
        botaoSalvar.disabled = false;
      }
    });


    document.getElementById("voltar").onclick = () => {
      window.location.href = "TelaUsuario.html";
    };


    carregarConta();

    Cep.ligar(document.getElementById("cep"), {
      rua:    document.getElementById("rua"),
      bairro: document.getElementById("bairro"),
      cidade: document.getElementById("cidade"),
      estado: document.getElementById("estado"),
      numero: document.getElementById("numero")
    });
    /* =====================================================
   VagaConnect · tema.js

   Liga o modo claro em qualquer tela do sistema.
   O escuro continua sendo o padrão.

   COMO USAR
   Em cada tela, depois do CSS dela:


   A escolha fica salva no navegador e vale para todas
   as telas, sem precisar escolher de novo a cada página.
===================================================== */

(function(){

    "use strict";


    const CHAVE = "vagaconnect-tema";


    // aplica antes de desenhar, para a tela não piscar
    const salvo = localStorage.getItem(CHAVE);

    if(salvo === "claro"){

        document.documentElement.setAttribute("data-tema", "claro");

    }



    /* =================================================
       DESENHOS DO BOTÃO
    ================================================= */

    const sol = `
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="4.2"/>
            <path d="M12 2.5v2.2M12 19.3v2.2M4.2 4.2l1.6 1.6M18.2 18.2l1.6 1.6
                     M2.5 12h2.2M19.3 12h2.2M4.2 19.8l1.6-1.6M18.2 5.8l1.6-1.6"/>
        </svg>`;


    const lua = `
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5Z"/>
        </svg>`;



    /* =================================================
       BOTÃO
    ================================================= */

    function criarBotao(){

        if(document.querySelector(".tema-botao")) return;


        const botao = document.createElement("button");

        botao.className = "tema-botao";

        botao.type = "button";

        document.body.appendChild(botao);


        function pintar(){

            const claro = document.documentElement.getAttribute("data-tema") === "claro";

            botao.innerHTML = claro ? lua : sol;

            botao.title = claro ? "Mudar para o modo escuro" : "Mudar para o modo claro";

            botao.setAttribute("aria-label", botao.title);

            botao.setAttribute("aria-pressed", claro ? "true" : "false");

        }


        botao.addEventListener("click", () => {

            const claro = document.documentElement.getAttribute("data-tema") === "claro";


            if(claro){

                document.documentElement.removeAttribute("data-tema");

                localStorage.setItem(CHAVE, "escuro");

            } else {

                document.documentElement.setAttribute("data-tema", "claro");

                localStorage.setItem(CHAVE, "claro");

            }


            pintar();

        });


        pintar();

    }


    if(document.readyState === "loading"){

        document.addEventListener("DOMContentLoaded", criarBotao);

    } else {

        criarBotao();

    }



    /* =================================================
       ATALHO DE TECLADO: Shift + T
    ================================================= */

    document.addEventListener("keydown", (evento) => {

        if(evento.shiftKey && (evento.key === "T" || evento.key === "t")){

            const alvo = evento.target;

            const digitando = alvo && ["INPUT", "TEXTAREA", "SELECT"].includes(alvo.tagName);

            if(digitando) return;


            const botao = document.querySelector(".tema-botao");

            if(botao) botao.click();

        }

    });

})();
  </script>

</body>
</html>
