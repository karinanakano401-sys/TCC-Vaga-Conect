<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>VagaConnect | Pagamento</title>

    <link rel="stylesheet" href="../CSS/TelaPagamentoUtilizacao.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>

<body>

    <div class="container">

        <section class="payment-card">

            <!-- Cabeçalho -->

            <header>

                <button class="voltar" onclick="history.back()">
                    <i class="fa-solid fa-arrow-left"></i>
                </button>

                <div>

                    <h2>Pagamento</h2>

                    <span id="valorFinal">Valor final: R$ 0,00</span>

                </div>

            </header>

            <!-- Título -->

            <h3>Escolha a forma de pagamento</h3>

            <!-- Cartão -->

            <label class="payment-option active">

                <div class="payment-left">

                    <div class="icon">

                        <i class="fa-regular fa-credit-card"></i>

                    </div>

                    <div>

                        <h4>Cartão de Crédito</h4>

                        <p>Pague com seu cartão</p>

                    </div>

                </div>

                <input
                    type="radio"
                    name="pagamento"
                    value="cartao"
                    checked>

            </label>

            <!-- PIX -->

            <label class="payment-option">

                <div class="payment-left">

                    <div class="icon">

                        <i class="fa-brands fa-pix"></i>

                    </div>

                    <div>

                        <h4>PIX</h4>

                        <p>Pague com PIX</p>

                    </div>

                </div>

                <input
                    type="radio"
                    name="pagamento"
                    value="pix">

            </label>

            <!-- Dinheiro -->

            <label class="payment-option">

                <div class="payment-left">

                    <div class="icon">

                        <i class="fa-solid fa-money-bill-wave"></i>

                    </div>

                    <div>

                        <h4>Dinheiro</h4>

                        <p>Pague em dinheiro</p>

                    </div>

                </div>

                <input
                    type="radio"
                    name="pagamento"
                    value="dinheiro">

            </label>

            <!-- Resumo -->

            <div class="resumo">

                <div class="linha">

                    <span>Tempo utilizado</span>

                    <strong id="tempoTela">00:00:00</strong>

                </div>

                <div class="linha">

                    <span>Valor da utilização</span>

                    <strong id="valorUtilizacao">R$ 0,00</strong>

                </div>

                <div class="linha desconto">

                    <span>(-) Garantia da Reserva</span>

                    <strong>- R$ 10,00</strong>

                </div>

                <div class="linha total">

                    <span>Total a pagar</span>

                    <strong id="valorTotal">R$ 0,00</strong>

                </div>

            </div>

            <!-- Botão -->

            <button id="btnPagar">

                <i class="fa-solid fa-lock"></i>

                Pagar R$ 24,00

            </button>

            <!-- Link -->

            <a href="#" id="detalhes">

                Ver detalhes da cobrança

            </a>

        </section>

    </div>

    <script>


const dados = JSON.parse(
    localStorage.getItem("dadosPagamento")
);

if(dados){

    document.getElementById("tempoTela").textContent =
    dados.tempo;

    document.getElementById("valorUtilizacao").textContent =
    dados.valorUtilizacao;

    document.getElementById("valorTotal").textContent =
    dados.total;

    document.getElementById("valorFinal").textContent =
    "Valor final: " + dados.total;

    document.getElementById("btnPagar").innerHTML =
    `<i class="fa-solid fa-lock"></i> Pagar ${dados.total}`;

}

// =====================================================
// VagaConnect
// Tela 12 - Pagamento da Utilização
// =====================================================

const opcoes = document.querySelectorAll(".payment-option");
const radios = document.querySelectorAll("input[name='pagamento']");
const botao = document.getElementById("btnPagar");
const detalhes = document.getElementById("detalhes");

// =======================================
// Seleção da forma de pagamento
// =======================================

function atualizarSelecao() {

    opcoes.forEach(opcao => {

        opcao.classList.remove("active");

        const radio = opcao.querySelector("input");

        if (radio.checked) {

            opcao.classList.add("active");

        }

    });

}

radios.forEach(radio => {

    radio.addEventListener("change", atualizarSelecao);

});

atualizarSelecao();

// =======================================
// Ver detalhes da cobrança
// =======================================

detalhes.addEventListener("click", function (e) {

    e.preventDefault();

    alert(
`Resumo da cobrança

Tempo utilizado:
04:25:36

Valor da utilização:
R$ 34,00

Garantia utilizada:
- R$ 10,00

-----------------------

Total:
R$ 24,00`
    );

});

// =======================================
// Pagamento
// =======================================

botao.addEventListener("click", function () {

    const metodo = document.querySelector(
        "input[name='pagamento']:checked"
    ).value;

    botao.disabled = true;
    botao.innerHTML =
        '<i class="fa-solid fa-spinner fa-spin"></i> Processando pagamento...';

    setTimeout(function () {

        switch (metodo) {

            case "cartao":

                alert("Pagamento realizado com Cartão de Crédito!");

                break;

            case "pix":

                alert("Pagamento realizado via PIX!");

                break;

            case "dinheiro":

                alert("Pagamento registrado para pagamento em dinheiro!");

                break;

        }

        // Redireciona para a Tela 13
        window.location.href = "../HTML/TelaReservaConcluida.html";

    }, 2200);

});
    </script>

</body>

</html>
