<!DOCTYPE html>
<html lang="pt-br">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cadastro VagaConnect</title>

<link rel="stylesheet" href="../CSS/OpçãoCadastro.css">

</head>

<body>

<div class="bg"></div>

<div class="container">

    <!-- =====================================================
         LOGO
    ====================================================== -->

    <div class="logo">

        <h1>
            Vaga<span>Connect</span>
        </h1>

        <p>
            Sistema Inteligente de Estacionamento
        </p>

    </div>


    <!-- =====================================================
         BOTÕES
    ====================================================== -->

    <div class="toggle-buttons">

        <button id="usuarioBtn" class="active">
            Usuário
        </button>

        <button id="adminBtn">
            Admin
        </button>

    </div>


    <!-- =====================================================
         TIPO DE CADASTRO
    ====================================================== -->

    <div class="tipo-cadastro" id="tipoTexto">
        Cadastro de Usuário
    </div>


    <!-- =====================================================
         FORMULÁRIO
    ====================================================== -->

    <form id="formulario"></form>

</div>


<script>

/* =====================================================
   ELEMENTOS
===================================================== */

const usuarioBtn = document.getElementById("usuarioBtn");
const adminBtn = document.getElementById("adminBtn");

const formulario = document.getElementById("formulario");
const tipoTexto = document.getElementById("tipoTexto");


/* =====================================================
   REMOVER ACTIVE
===================================================== */

function removerActive(){

    usuarioBtn.classList.remove("active");

    adminBtn.classList.remove("active");

}


/* =====================================================
   MÁSCARA CPF
===================================================== */

function aplicarMascaraCPF(input){

    input.addEventListener("input", () => {

        let value = input.value.replace(/\D/g, "");

        value = value.replace(/(\d{3})(\d)/, "$1.$2");

        value = value.replace(/(\d{3})(\d)/, "$1.$2");

        value = value.replace(
            /(\d{3})(\d{1,2})$/,
            "$1-$2"
        );

        input.value = value;

    });

}


/* =====================================================
   MÁSCARA CEP
===================================================== */

function aplicarMascaraCEP(input){

    input.addEventListener("input", () => {

        let value = input.value.replace(/\D/g, "");

        value = value.replace(
            /(\d{5})(\d)/,
            "$1-$2"
        );

        input.value = value;

    });

}


/* =====================================================
   VALIDAÇÃO CPF
===================================================== */

function validarCPF(cpf){

    cpf = cpf.replace(/\D/g, "");

    if(cpf.length !== 11){
        return false;
    }

    if(/^(\d)\1+$/.test(cpf)){
        return false;
    }

    return true;

}


/* =====================================================
   VALIDAÇÃO MAIOR DE 18 ANOS
===================================================== */

function validarMaiorDe18(dataNascimento){

    if(!dataNascimento){
        return false;
    }

    const nascimento = new Date(
        dataNascimento + "T00:00:00"
    );

    const hoje = new Date();

    let idade =
        hoje.getFullYear() -
        nascimento.getFullYear();

    const mesAtual =
        hoje.getMonth();

    const mesNascimento =
        nascimento.getMonth();

    const diaAtual =
        hoje.getDate();

    const diaNascimento =
        nascimento.getDate();


    if(
        mesAtual < mesNascimento ||
        (
            mesAtual === mesNascimento &&
            diaAtual < diaNascimento
        )
    ){

        idade--;

    }


    return idade >= 18;

}


/* =====================================================
   USUÁRIO
===================================================== */

function carregarUsuario(){

    tipoTexto.innerHTML =
        "Cadastro de Usuário";


    formulario.innerHTML = `

        <div class="form-grid">


            <!-- NOME -->

            <div class="input-box">

                <label>
                    Nome
                </label>

                <input
                    id="nome"
                    type="text"
                    placeholder="Digite seu nome"
                    required
                >

            </div>


            <!-- EMAIL -->

            <div class="input-box">

                <label>
                    Email
                </label>

                <input
                    id="email"
                    type="email"
                    placeholder="Digite seu email"
                    required
                >

            </div>


            <!-- CPF -->

            <div class="input-box">

                <label>
                    CPF
                </label>

                <input
                    id="cpf"
                    type="text"
                    placeholder="000.000.000-00"
                    maxlength="14"
                    required
                >

            </div>


            <!-- DATA DE NASCIMENTO -->

            <div class="input-box">

                <label>
                    Data de nascimento
                </label>

                <input
                    id="dataNascimento"
                    type="date"
                    required
                >

            </div>


            <!-- =================================================
                 CEP
                 AGORA ESTÁ NO LUGAR ONDE ESTAVA A RUA
            ================================================== -->

            <div class="input-box">

                <label>
                    CEP
                </label>

                <input
                    id="cep"
                    type="text"
                    placeholder="00000-000"
                    maxlength="9"
                    required
                >

            </div>


            <!-- NÚMERO -->

            <div class="input-box">

                <label>
                    Número
                </label>

                <input
                    id="numero"
                    type="text"
                    placeholder="Número da casa"
                    required
                >

            </div>


            <!-- =================================================
                 RUA
                 AGORA ESTÁ NO LUGAR ONDE ESTAVA O CEP
            ================================================== -->

            <div class="input-box">

                <label>
                    Rua
                </label>

                <input
                    id="rua"
                    type="text"
                    placeholder="Nome da rua"
                    required
                >

            </div>


            <!-- CIDADE -->

            <div class="input-box">

                <label>
                    Cidade
                </label>

                <input
                    id="cidade"
                    type="text"
                    placeholder="Sua cidade"
                    required
                >

            </div>


            <!-- SENHA -->

            <div class="input-box">

                <label>
                    Criar Senha
                </label>

                <input
                    id="senha"
                    type="password"
                    placeholder="Crie sua senha"
                    required
                >

            </div>


            <!-- CONFIRMAR SENHA -->

            <div class="input-box">

                <label>
                    Confirmar Senha
                </label>

                <input
                    id="confirmarSenha"
                    type="password"
                    placeholder="Confirme sua senha"
                    required
                >

            </div>


        </div>


        <!-- BOTÃO -->

        <button
            class="btn"
            id="btnCadastrar"
            type="submit"
        >

            Cadastrar Usuário

        </button>


        <!-- LOGIN -->

        <div class="extra">

            Já possui conta?

            <a href="../HTML/OpçãoLogin.html">
                Entrar
            </a>

        </div>

    `;


    /* =================================================
       ELEMENTOS
    ================================================= */

    const cpfInput =
        document.getElementById("cpf");

    const cepInput =
        document.getElementById("cep");

    const dataNascimento =
        document.getElementById("dataNascimento");

    const btn =
        document.getElementById("btnCadastrar");


    /* =================================================
       MÁSCARAS
    ================================================= */

    aplicarMascaraCPF(cpfInput);

    aplicarMascaraCEP(cepInput);


    /* =================================================
       DATA MÁXIMA
       IMPEDE SELECIONAR UMA DATA QUE NÃO TENHA
       PELO MENOS 18 ANOS
    ================================================= */

    const hoje = new Date();

    const dataMaxima = new Date(
        hoje.getFullYear() - 18,
        hoje.getMonth(),
        hoje.getDate()
    );


    const ano =
        dataMaxima.getFullYear();

    const mes =
        String(
            dataMaxima.getMonth() + 1
        ).padStart(2, "0");

    const dia =
        String(
            dataMaxima.getDate()
        ).padStart(2, "0");


    dataNascimento.max =
        `${ano}-${mes}-${dia}`;


    /* =================================================
       CADASTRO
    ================================================= */

    btn.addEventListener("click", (e) => {

        e.preventDefault();


        const nome =
            document
                .getElementById("nome")
                .value
                .trim();


        const email =
            document
                .getElementById("email")
                .value
                .trim();


        const cpf =
            cpfInput.value.trim();


        const nascimento =
            dataNascimento.value;


        const rua =
            document
                .getElementById("rua")
                .value
                .trim();


        const numero =
            document
                .getElementById("numero")
                .value
                .trim();


        const cep =
            cepInput.value.trim();


        const cidade =
            document
                .getElementById("cidade")
                .value
                .trim();


        const senha =
            document
                .getElementById("senha")
                .value;


        const confirmarSenha =
            document
                .getElementById("confirmarSenha")
                .value;


        /* =================================================
           CAMPOS VAZIOS
        ================================================= */

        if(
            !nome ||
            !email ||
            !cpf ||
            !nascimento ||
            !rua ||
            !numero ||
            !cep ||
            !cidade ||
            !senha ||
            !confirmarSenha
        ){

            alert(
                "Preencha todos os campos!"
            );

            return;

        }


        /* =================================================
           CPF
        ================================================= */

        if(!validarCPF(cpf)){

            alert(
                "CPF inválido!"
            );

            return;

        }


        /* =================================================
           MAIOR DE 18
        ================================================= */

        if(!validarMaiorDe18(nascimento)){

            alert(
                "O cadastro é permitido somente para pessoas maiores de 18 anos."
            );

            return;

        }


        /* =================================================
           SENHAS
        ================================================= */

        if(senha !== confirmarSenha){

            alert(
                "As senhas não coincidem!"
            );

            return;

        }


        /* =================================================
           SUCESSO
        ================================================= */

        alert(
            "Cadastro realizado com sucesso!"
        );

    });

}


/* =====================================================
   ADMINISTRADOR
===================================================== */

function carregarAdmin(){

    tipoTexto.innerHTML =
        "Cadastro de Administrador";


    formulario.innerHTML = `

       


        <!-- =================================================
             FORMULÁRIO
        ================================================== -->

        <div class="form-grid">


            <!-- =================================================
                 NOME DO ADMINISTRADOR
            ================================================== -->

            <div class="input-box">

                <label>
                    Nome
                </label>

                <input
                    id="adminNome"
                    type="text"
                    placeholder="Digite seu nome"
                    required
                >

            </div>


            <!-- =================================================
                 EMAIL
            ================================================== -->

            <div class="input-box">

                <label>
                    Email
                </label>

                <input
                    id="adminEmail"
                    type="email"
                    placeholder="Digite seu email"
                    required
                >

            </div>


            <!-- =================================================
                 CPF
            ================================================== -->

            <div class="input-box">

                <label>
                    CPF
                </label>

                <input
                    id="adminCPF"
                    type="text"
                    placeholder="000.000.000-00"
                    maxlength="14"
                    required
                >

            </div>


            <!-- =================================================
                 DATA DE NASCIMENTO
            ================================================== -->

            <div class="input-box">

                <label>
                    Data de nascimento
                </label>

                <input
                    id="adminDataNascimento"
                    type="date"
                    required
                >

            </div>

 <!-- =================================================
             TÍTULO DO ESTACIONAMENTO
        ================================================== -->

        <div class="endereco-titulo">

            <strong>
                Dados do Estacionamento
            </strong>

            <span>
                Informe os dados do estacionamento que será
                administrado por você.
            </span>

        </div>
        


            <!-- =================================================
                 CEP DO ESTACIONAMENTO
            ================================================== -->

            <div class="input-box">

                <label>
                    CEP do estacionamento
                </label>

                <input
                    id="cepEstacionamento"
                    type="text"
                    placeholder="00000-000"
                    maxlength="9"
                    required
                >

            </div>


            <!-- =================================================
                 RUA DO ESTACIONAMENTO
            ================================================== -->

            <div class="input-box">

                <label>
                    Rua do estacionamento
                </label>

                <input
                    id="ruaEstacionamento"
                    type="text"
                    placeholder="Nome da rua"
                    required
                >

            </div>


            <!-- =================================================
                 CIDADE DO ESTACIONAMENTO
            ================================================== -->

            <div class="input-box">

                <label>
                    Cidade do estacionamento
                </label>

                <input
                    id="cidadeEstacionamento"
                    type="text"
                    placeholder="Cidade"
                    required
                >

            </div>


            <!-- =================================================
                 SENHA
            ================================================== -->

            <div class="input-box">

                <label>
                    Criar Senha
                </label>

                <input
                    id="adminSenha"
                    type="password"
                    placeholder="Crie sua senha"
                    required
                >

            </div>


            <!-- =================================================
                 CONFIRMAR SENHA
            ================================================== -->

            <div class="input-box">

                <label>
                    Confirmar Senha
                </label>

                <input
                    id="adminConfirmarSenha"
                    type="password"
                    placeholder="Confirme sua senha"
                    required
                >

            </div>


        </div>


        <!-- =================================================
             RESUMO DO ESTACIONAMENTO
        ================================================== -->

        <div
            class="estacionamento-resumo"
            id="estacionamentoResumo"
        >

            <span>
                Estacionamento:
            </span>

            <strong id="resumoNome">
                Preencha o nome do estacionamento
            </strong>

            <small id="resumoEndereco">
                O endereço do estacionamento aparecerá aqui.
            </small>

        </div>


        <!-- =================================================
             BOTÃO
        ================================================== -->

        <button
            class="btn"
            id="btnCadastrarAdmin"
            type="submit"
        >

            Cadastrar Administrador

        </button>


        <!-- =================================================
             LOGIN
        ================================================== -->

        <div class="extra">

            Já possui conta?

            <a href="../HTML/OpçãoLogin.html">
                Entrar
            </a>

        </div>

    `;


    /* =================================================
       ELEMENTOS
    ================================================= */

    const cpfInput =
        document.getElementById("adminCPF");


    const cepInput =
        document.getElementById("cepEstacionamento");


    const dataNascimento =
        document.getElementById("adminDataNascimento");


    const nomeEstacionamento =
        document.getElementById("nomeEstacionamento");


    const ruaEstacionamento =
        document.getElementById("ruaEstacionamento");


    const numeroEstacionamento =
        document.getElementById("numeroEstacionamento");


    const cidadeEstacionamento =
        document.getElementById("cidadeEstacionamento");


    const resumoNome =
        document.getElementById("resumoNome");


    const resumoEndereco =
        document.getElementById("resumoEndereco");


    const btn =
        document.getElementById("btnCadastrarAdmin");


    /* =================================================
       MÁSCARAS
    ================================================= */

    aplicarMascaraCPF(cpfInput);

    aplicarMascaraCEP(cepInput);


    /* =================================================
       DATA MÁXIMA
       ADMINISTRADOR PRECISA TER PELO MENOS 18 ANOS
    ================================================= */

    const hoje = new Date();


    const dataMaxima = new Date(
        hoje.getFullYear() - 18,
        hoje.getMonth(),
        hoje.getDate()
    );


    const ano =
        dataMaxima.getFullYear();


    const mes =
        String(
            dataMaxima.getMonth() + 1
        ).padStart(2, "0");


    const dia =
        String(
            dataMaxima.getDate()
        ).padStart(2, "0");


    dataNascimento.max =
        `${ano}-${mes}-${dia}`;


    /* =================================================
       MOSTRAR DADOS DO ESTACIONAMENTO EM TEMPO REAL
    ================================================= */

    function atualizarResumo(){

        const nome =
            nomeEstacionamento
                .value
                .trim();


        const rua =
            ruaEstacionamento
                .value
                .trim();


        const numero =
            numeroEstacionamento
                .value
                .trim();


        const cidade =
            cidadeEstacionamento
                .value
                .trim();


        const cep =
            cepInput
                .value
                .trim();


        /* =================================================
           NOME
        ================================================= */

        if(nome){

            resumoNome.textContent =
                nome;

        }else{

            resumoNome.textContent =
                "Preencha o nome do estacionamento";

        }


        /* =================================================
           ENDEREÇO
        ================================================= */

        let endereco = "";


        if(rua){

            endereco += rua;

        }


        if(numero){

            endereco +=
                endereco
                    ? ", " + numero
                    : numero;

        }


        if(cidade){

            endereco +=
                endereco
                    ? " - " + cidade
                    : cidade;

        }


        if(cep){

            endereco +=
                endereco
                    ? " | CEP: " + cep
                    : "CEP: " + cep;

        }


        /* =================================================
           MOSTRAR ENDEREÇO
        ================================================= */

        if(endereco){

            resumoEndereco.textContent =
                endereco;

        }else{

            resumoEndereco.textContent =
                "O endereço do estacionamento aparecerá aqui.";

        }

    }


    /* =================================================
       ATUALIZAÇÃO AUTOMÁTICA
    ================================================= */

    nomeEstacionamento.addEventListener(
        "input",
        atualizarResumo
    );


    ruaEstacionamento.addEventListener(
        "input",
        atualizarResumo
    );


    numeroEstacionamento.addEventListener(
        "input",
        atualizarResumo
    );


    cidadeEstacionamento.addEventListener(
        "input",
        atualizarResumo
    );


    cepInput.addEventListener(
        "input",
        atualizarResumo
    );


    /* =================================================
       CADASTRAR ADMINISTRADOR
    ================================================= */

    btn.addEventListener("click", (e) => {

        e.preventDefault();


        /* =================================================
           DADOS DO ADMINISTRADOR
        ================================================= */

        const nome =
            document
                .getElementById("adminNome")
                .value
                .trim();


        const email =
            document
                .getElementById("adminEmail")
                .value
                .trim();


        const cpf =
            cpfInput.value.trim();


        const nascimento =
            dataNascimento.value;


        /* =================================================
           DADOS DO ESTACIONAMENTO
        ================================================= */

        const estacionamento =
            nomeEstacionamento
                .value
                .trim();


        const cep =
            cepInput.value
                .trim();


        const rua =
            ruaEstacionamento
                .value
                .trim();


        const numero =
            numeroEstacionamento
                .value
                .trim();


        const cidade =
            cidadeEstacionamento
                .value
                .trim();


        /* =================================================
           SENHAS
        ================================================= */

        const senha =
            document
                .getElementById("adminSenha")
                .value;


        const confirmarSenha =
            document
                .getElementById("adminConfirmarSenha")
                .value;


        /* =================================================
           CAMPOS OBRIGATÓRIOS
        ================================================= */

        if(
            !nome ||
            !email ||
            !cpf ||
            !nascimento ||
            !estacionamento ||
            !cep ||
            !rua ||
            !numero ||
            !cidade ||
            !senha ||
            !confirmarSenha
        ){

            alert(
                "Preencha todos os campos!"
            );

            return;

        }


        /* =================================================
           VALIDAÇÃO CPF
        ================================================= */

        if(!validarCPF(cpf)){

            alert(
                "CPF inválido!"
            );

            return;

        }


        /* =================================================
           VALIDAÇÃO DE IDADE
        ================================================= */

        if(
            !validarMaiorDe18(
                nascimento
            )
        ){

            alert(
                "O cadastro é permitido somente para pessoas maiores de 18 anos."
            );

            return;

        }


        /* =================================================
           VALIDAÇÃO DAS SENHAS
        ================================================= */

        if(
            senha !== confirmarSenha
        ){

            alert(
                "As senhas não coincidem!"
            );

            return;

        }


        /* =================================================
           SALVAR DADOS DO ESTACIONAMENTO
           NO LOCALSTORAGE
        ================================================= */

        const dadosEstacionamento = {

            nome: estacionamento,

            cep: cep,

            rua: rua,

            numero: numero,

            cidade: cidade,

            endereco:
                rua +
                ", " +
                numero +
                " - " +
                cidade,

            enderecoCompleto:
                rua +
                ", " +
                numero +
                " - " +
                cidade +
                " | CEP: " +
                cep

        };


        localStorage.setItem(
            "estacionamentoSelecionado",
            JSON.stringify(
                dadosEstacionamento
            )
        );


        /* =================================================
           TAMBÉM SALVAR INDIVIDUALMENTE
           PARA OUTRAS TELAS DO SISTEMA
        ================================================= */

        localStorage.setItem(
            "nomeEstacionamento",
            estacionamento
        );


        localStorage.setItem(
            "enderecoEstacionamento",
            dadosEstacionamento.enderecoCompleto
        );


        localStorage.setItem(
            "cepEstacionamento",
            cep
        );


        localStorage.setItem(
            "ruaEstacionamento",
            rua
        );


        localStorage.setItem(
            "numeroEstacionamento",
            numero
        );


        localStorage.setItem(
            "cidadeEstacionamento",
            cidade
        );


        /* =================================================
           SUCESSO
        ================================================= */

        alert(
            "Administrador cadastrado com sucesso!\n\n" +

            "Estacionamento: " +
            estacionamento +

            "\n\nEndereço: " +
            rua +
            ", " +
            numero +
            " - " +
            cidade +

            "\nCEP: " +
            cep
        );

    });

}

/* =====================================================
   BOTÃO USUÁRIO
===================================================== */

usuarioBtn.addEventListener("click", () => {

    removerActive();

    usuarioBtn.classList.add("active");

    carregarUsuario();

});


/* =====================================================
   BOTÃO ADMIN
===================================================== */

adminBtn.addEventListener("click", () => {

    removerActive();

    adminBtn.classList.add("active");

    carregarAdmin();

});


/* =====================================================
   INICIAL
===================================================== */

carregarUsuario();

</script>

</body>

</html>
