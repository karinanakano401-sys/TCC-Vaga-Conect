/* =====================================================
   MÁSCARA CPF
===================================================== */

function aplicarMascaraCPF(input){

    input.addEventListener("input", () => {

        let value = input.value.replace(/\D/g, "");

        value = value.replace(/(\d{3})(\d)/, "$1.$2");

        value = value.replace(/(\d{3})(\d)/, "$1.$2");

        value = value.replace(
            /(\d{3})(\d{1,2})$/,
            "$1-$2"
        );

        input.value = value;

    });

}


/* =====================================================
   MÁSCARA CEP
===================================================== */

function aplicarMascaraCEP(input){

    input.addEventListener("input", () => {

        let value = input.value.replace(/\D/g, "");

        value = value.replace(
            /(\d{5})(\d)/,
            "$1-$2"
        );

        input.value = value;

    });

}


/* =====================================================
   VALIDAÇÃO CPF
===================================================== */

function validarCPF(cpf){

    cpf = cpf.replace(/\D/g, "");

    if(cpf.length !== 11){
        return false;
    }

    if(/^(\d)\1+$/.test(cpf)){
        return false;
    }

    return true;

}


/* =====================================================
   VALIDAÇÃO MAIOR DE 18 ANOS
===================================================== */

function validarMaiorDe18(dataNascimento){

    if(!dataNascimento){
        return false;
    }

    const nascimento = new Date(
        dataNascimento + "T00:00:00"
    );

    const hoje = new Date();

    let idade =
        hoje.getFullYear() -
        nascimento.getFullYear();

    const mesAtual =
        hoje.getMonth();

    const mesNascimento =
        nascimento.getMonth();

    const diaAtual =
        hoje.getDate();

    const diaNascimento =
        nascimento.getDate();


    if(
        mesAtual < mesNascimento ||
        (
            mesAtual === mesNascimento &&
            diaAtual < diaNascimento
        )
    ){

        idade--;

    }


    return idade >= 18;

}


/* =====================================================
   API — CADASTRO USUÁRIO + ENDEREÇO
===================================================== */

async function cadastrarUsuarioNaApi(dados, api){

    let enderecoId = null;

    try {

        const respostaEndereco = await fetch(api + "/endereco", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                rua: dados.rua,
                numero: dados.numero,
                bairro: dados.bairro,
                cidade: dados.cidade,
                estado: dados.estado,
                cep: dados.cep
            })
        });

        const endereco = await respostaEndereco.json();

        if(!respostaEndereco.ok){
            throw new Error(endereco.erro || "Erro ao criar endereço");
        }

        enderecoId = endereco.id;

        const respostaUsuario = await fetch(api + "/usuario", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                nome: dados.nome,
                dataNascimento: dados.dataNascimento,
                cpf: dados.cpf,
                email: dados.email,
                senha: dados.senha,
                fk_idEndereco: endereco.id
            })
        });

        const usuario = await respostaUsuario.json();

        if(!respostaUsuario.ok){
            throw new Error(usuario.erro || "Erro ao criar usuário");
        }

        alert("Cadastro realizado com sucesso!");
        window.location.replace("OpçãoLogin.html");
        return true;

    } catch (error) {

        if(enderecoId){
            await fetch(api + "/endereco/" + enderecoId, {
                method: "DELETE"
            }).catch(() => {});
        }

        alert(error.message || "Não foi possível cadastrar. Verifique se o servidor está ligado.");
        return false;

    }

}


/* =====================================================
   API — TIPO DE FUNCIONÁRIO
   Reaproveita o tipo se ele já existir
===================================================== */

async function garantirTipoFunc(nome, tipo, api){

    const resposta = await fetch(api + "/tipofunc");

    const tipos = await resposta.json();

    if(!resposta.ok){
        throw new Error(tipos.erro || "Erro ao buscar os tipos de funcionário");
    }


    const existente = tipos.find(t =>
        t.nome === nome && t.tipo === tipo
    );

    if(existente){
        return existente;
    }


    const respostaNovo = await fetch(api + "/tipofunc", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            nome: nome,
            tipo: tipo
        })
    });

    const novo = await respostaNovo.json();

    if(!respostaNovo.ok){
        throw new Error(novo.erro || "Erro ao criar o tipo de funcionário");
    }

    return novo;

}


/* =====================================================
   API — CADASTRO ADMIN + ESTACIONAMENTO
===================================================== */

async function cadastrarAdminNaApi(dados, api){

    let enderecoId = null;

    let estacionamentoId = null;

    try {

        const respostaEndereco = await fetch(api + "/endereco", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                rua: dados.rua,
                numero: dados.numero,
                bairro: dados.bairro,
                cidade: dados.cidade,
                estado: dados.estado,
                cep: dados.cep
            })
        });

        const endereco = await respostaEndereco.json();

        if(!respostaEndereco.ok){
            throw new Error(endereco.erro || "Erro ao criar endereço");
        }

        enderecoId = endereco.id;


        const respostaEstacionamento = await fetch(api + "/estacionamento", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                nome: dados.estacionamento,
                status: "Ativo",
                fk_idEndereco: endereco.id
            })
        });

        const estacionamento = await respostaEstacionamento.json();

        if(!respostaEstacionamento.ok){
            throw new Error(estacionamento.erro || "Erro ao criar estacionamento");
        }

        estacionamentoId = estacionamento.id;


        const tipoFunc = await garantirTipoFunc(
            "Administrador",
            "admin",
            api
        );


        const respostaFuncionario = await fetch(api + "/funcionario", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                nome: dados.nome,
                dataNascimento: dados.dataNascimento,
                cpf: dados.cpf,
                telefone: dados.telefone,
                email: dados.email,
                senha: dados.senha,
                fk_tipofunc: tipoFunc.id,
                fk_est: estacionamento.id
            })
        });

        const funcionario = await respostaFuncionario.json();

        if(!respostaFuncionario.ok){
            throw new Error(funcionario.erro || "Erro ao criar administrador");
        }


        alert("Administrador cadastrado com sucesso!");

        window.location.replace("OpçãoLogin.html");

        return true;

    } catch (error) {

        if(estacionamentoId){
            await fetch(api + "/estacionamento/" + estacionamentoId, {
                method: "DELETE"
            }).catch(() => {});
        }

        if(enderecoId){
            await fetch(api + "/endereco/" + enderecoId, {
                method: "DELETE"
            }).catch(() => {});
        }

        alert(error.message || "Não foi possível cadastrar. Verifique se o servidor está ligado.");

        return false;

    }

}

                .value
                .trim();


        const numero =

                .value

            cepInput.value.trim();

                .getElementById("bairro")
                .value
                .trim();


        const estado =
            document
                .getElementById("estado")
                .value
                .trim()

        const senha =
            document
                .getElementById("senha")
                .value;


        const confirmarSenha =
            document
                .getElementById("confirmarSenha")
                .value;

           CAMPOS VAZIOS
        ================================================= */

            !nome ||
            !email ||
            !cpf ||
            !nascimento ||
            !rua ||
            !numero ||
            !cep ||
            !cidade ||
            !bairro ||
            !estado ||
            !senha ||
            !confirmarSenha
        ){

            alert(
                "Preencha todos os campos!"
            );

            return;

        }


        /* =================================================
           CPF
        ================================================= */

        if(!validarCPF(cpf)){

            alert(
                "CPF inválido!"
            );

            return;

        }


        /* =================================================
           MAIOR DE 18
        ================================================= */

        if(!validarMaiorDe18(nascimento)){

            alert(
                "O cadastro é permitido somente para pessoas maiores de 18 anos."
            );

            return;

        }


        /* =================================================
           SENHAS
        ================================================= */

        if(senha !== confirmarSenha){

            alert(
                "As senhas não coincidem!"
            );

            return;

        }


        /* =================================================
           API
        ================================================= */

        const api = "http://localhost:3333";

        btn.disabled = true;

        cadastrarUsuarioNaApi({
            nome,
            email,
            cpf,
            dataNascimento: nascimento,
            senha,
            rua,
            numero,
            bairro,
            cidade,
            estado,
            cep
        }, api).finally(() => {

            btn.disabled = false;

        });

    });

}

                .value
                .trim();


        const cep =
            cepInput
                .value
                .trim();


        /* =================================================
           NOME
        ================================================= */

        if(nome){

            resumoNome.textContent =
                nome;

        }else{

            resumoNome.textContent =
                "Preencha o nome do estacionamento";

        }


        /* =================================================
           ENDEREÇO
        ================================================= */

        let endereco = "";


        if(rua){

            endereco += rua;

        }


        if(numero){

            endereco +=
                endereco
                    ? ", " + numero
                    : numero;

        }


        if(cidade){

            endereco +=
                endereco
                    ? " - " + cidade
                    : cidade;

        }


        if(cep){

            endereco +=
                endereco
                    ? " | CEP: " + cep
                    : "CEP: " + cep;

        }


        /* =================================================
           MOSTRAR ENDEREÇO
        ================================================= */

        if(endereco){

            resumoEndereco.textContent =
                endereco;

        }else{

            resumoEndereco.textContent =
                "O endereço do estacionamento aparecerá aqui.";

        }

    }


    /* =================================================
       ATUALIZAÇÃO AUTOMÁTICA
    ================================================= */

    nomeEstacionamento.addEventListener(
        "input",
        atualizarResumo
    );


    ruaEstacionamento.addEventListener(
        "input",
        atualizarResumo
    );


    numeroEstacionamento.addEventListener(
        "input",
        atualizarResumo
    );


    cidadeEstacionamento.addEventListener(
        "input",
        atualizarResumo
    );


    cepInput.addEventListener(
        "input",
        atualizarResumo
    );


    /* =================================================
       CADASTRAR ADMINISTRADOR
    ================================================= */

    btn.addEventListener("click", (e) => {

        e.preventDefault();


        /* =================================================
           DADOS DO ADMINISTRADOR
        ================================================= */

        const nome =
            document
                .getElementById("adminNome")
                .value
                .trim();


        const email =
            document
                .getElementById("adminEmail")
                .value
                .trim();


        const cpf =
            cpfInput.value.trim();


        const nascimento =
            dataNascimento.value;


        const telefone =
            document
                .getElementById("adminTelefone")
                .value
                .trim();


        /* =================================================
           DADOS DO ESTACIONAMENTO
        ================================================= */

        const estacionamento =
            nomeEstacionamento
                .value
                .trim();


        const cep =
            cepInput.value
                .trim();


        const rua =
            ruaEstacionamento
                .value
                .trim();


        const numero =
            numeroEstacionamento
                .value
                .trim();


        const bairro =
            document
                .getElementById("bairroEstacionamento")
                .value
                .trim();


        const cidade =
            cidadeEstacionamento
                .value
                .trim();


        const estado =
            document
                .getElementById("estadoEstacionamento")
                .value
                .trim()
                .toUpperCase();


        /* =================================================
           SENHAS
        ================================================= */

        const senha =
            document
                .getElementById("adminSenha")
                .value;


        const confirmarSenha =
            document
                .getElementById("adminConfirmarSenha")
                .value;


        /* =================================================
           CAMPOS OBRIGATÓRIOS
        ================================================= */

        if(
            !nome ||
            !email ||
            !cpf ||
            !nascimento ||
            !telefone ||
            !estacionamento ||
            !cep ||
            !rua ||
            !numero ||
            !bairro ||
            !cidade ||
            !estado ||
            !senha ||
            !confirmarSenha
        ){

            alert(
                "Preencha todos os campos!"
            );

            return;

        }


        /* =================================================
           VALIDAÇÃO CPF
        ================================================= */

        if(!validarCPF(cpf)){

            alert(
                "CPF inválido!"
            );

            return;

        }


        /* =================================================
           VALIDAÇÃO DE IDADE
        ================================================= */

        if(
            !validarMaiorDe18(
                nascimento
            )
        ){

            alert(
                "O cadastro é permitido somente para pessoas maiores de 18 anos."
            );

            return;

        }


        /* =================================================
           VALIDAÇÃO DAS SENHAS
        ================================================= */

        if(
            senha !== confirmarSenha
        ){

            alert(
                "As senhas não coincidem!"
            );

            return;

        }


        /* =================================================
           API
        ================================================= */

        const api = "http://localhost:3333";

        btn.disabled = true;

        cadastrarAdminNaApi({
            nome,
            email,
            cpf,
            dataNascimento: nascimento,
            telefone,
            senha,
            estacionamento,
            rua,
            numero,
            bairro,
            cidade,
            estado,
            cep
        }, api).finally(() => {

            btn.disabled = false;

        });

    });

}
