      <div class="profile">

          <strong>Administrador</strong>

    <main class="content">
      <header>
        <h1>Configurações do Sistema</h1>
        <p>Personalize as informações da empresa.</p>
      </header>

      <section class="config-panel">
        <form id="settingsForm">
          <h2>Dados da Empresa</h2>

          <div class="form-grid">
            <label>
              Nome da empresa
              <input value="VagaConnect" required>
            </label>

            <label>
              E-mail
              <input type="email" value="contato@vagaconnect.com" required>
            </label>

            <label>
              Telefone
              <input value="(11) 4000-0000">
            </label>

            <label>
              Valor por minuto
              <input value="R$ 0,10">
            </label>

            <label>
              Valor por hora
              <input value="R$ 6,50">
            </label>
          </div>

          <div class="logo-box">
            <span class="logo-preview">
              <b>P</b>
              VagaConnect
            </span>

            <button type="button" id="logoButton">
              Alterar logo
            </button>
          </div>

          <div class="actions">
            <button class="secondary" type="reset">
              Restaurar padrão
            </button>

            <button class="primary" type="submit">
              Salvar alterações
            </button>
          </div>
        </form>
      </section>
    </main>

  <script src="../../Base/JS/sessao.js"></script>
  <script>

    const icons = {

grid:
'<rect x="3" y="3" width="7" height="7"/>'+
'<rect x="14" y="3" width="7" height="7"/>'+
'<rect x="3" y="14" width="7" height="7"/>'+
'<rect x="14" y="14" width="7" height="7"/>',

'<rect x="4" y="3" width="16" height="18" rx="1"/>'+

'<circle cx="7" cy="15" r="1"/>'+
'<circle cx="17" cy="15" r="1"/>',


calendar:
'<rect x="3" y="5" width="18" height="16" rx="2"/>'+
'<path d="M16 3v4M8 3v4M3 10h18"/>',


users:
'<circle cx="9" cy="8" r="3"/>'+

briefcase:
'<rect x="3" y="7" width="18" height="13" rx="2"/>'+

message:

"credit-card":
'<rect x="3" y="5" width="18" height="14" rx="2"/>'+
'<path d="M3 10h18M7 15h2"/>',


chart:
'<path d="M4 19V5"/>'+
'<path d="M4 19h16"/>'+
'<path d="M8 15v-3"/>'+
'<path d="M12 15V8"/>'+
'<path d="M16 15V5"/>',


settings:
'<circle cx="12" cy="12" r="3"/>'+
'<path d="M12 2v2m0 16v2M2 12h2m16 0h2"/>',


"log-out":
'<path d="M10 17l5-5-5-5M15 12H3M21 19V5a2 2 0 0 0-2-2h-5"/>',

  search: '<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>',
  refresh: '<path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v6h-6"/>'

};

const svg = (name)=>`

<svg viewBox="0 0 24 24"
fill="none"
stroke="currentColor"
stroke-width="1.8"
stroke-linecap="round"
stroke-linejoin="round">

${icons[name]}

</svg>

`;


document.querySelectorAll("i[data-icon]").forEach(icon=>{

icon.outerHTML = svg(icon.dataset.icon);

});


    document.querySelector("#settingsForm").addEventListener("submit", (event) => {
      event.preventDefault();
      alert("Configurações salvas com sucesso!");
    });

    document.querySelector("#logoButton").addEventListener("click", () => {
      alert("Selecione uma nova imagem para o logo.");
    });
  </script>
