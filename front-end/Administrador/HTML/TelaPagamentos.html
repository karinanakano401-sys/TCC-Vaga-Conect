<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VagaConnect | Pagamentos</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="../CSS/TelaPagamentos.css">
</head>

<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="logo">
       <i class="fa-solid fa-layer-group"></i>
       <a href="TelaADM.html" class="logo">
       <span>Vaga</span>Connect
       </a>
     </div>

      <nav>
        <a href="../HTML/TelaADM.html"><i data-icon="grid"></i>Dashboard</a>
        <a href="../HTML/TelaEstacionamento.html"><i data-icon="building"></i>Estacionamentos</a>
        <a href="../HTML/TelaVagas.html"><i data-icon="car"></i>Vagas</a>
        <a href="../HTML/TelaReservas.html"><i data-icon="calendar"></i>Reservas</a>
        <a href="../HTML/TelaUsuarios.html"><i data-icon="users"></i>Usuários</a>
        <a href="../HTML/TelaFuncionarios.html"><i data-icon="briefcase"></i>Funcionários</a>
        <a href="../HTML/TelaFeedback.html"><i data-icon="message"></i>Feedbacks</a>
        <a class="active" href="#"><i data-icon="credit-card"></i>Pagamentos</a>
        <a href="../HTML/TelaFaturamento.html"><i data-icon="chart"></i>Faturamento</a>
        <a href="../HTML/TelaConfigurações.html"><i data-icon="settings"></i>Configurações</a>
        <a href="#" id="btnSair"><i data-icon="log-out"></i>Sair</a>
      </nav>

      <div class="profile">
        <span class="avatar">A</span>

        <div>
          <strong>Administrador</strong>
          <small>admin</small>
        </div>
      </div>
    </aside>

    <main class="content">
      <header>
        <h1>Pagamentos</h1>
        <p>Acompanhe os pagamentos realizados nas reservas.</p>
      </header>

      <section class="panel">
        <div class="toolbar">
          <label>
            Tipo
            <select id="type">
              <option value="">Todos</option>
              <option value="pix">Pix</option>
              <option value="cartao">Cartão</option>
            </select>
          </label>

          <label>
            Estacionamento
            <select id="parking">
              <option value="">Todos</option>
            </select>
          </label>

          <label class="search">
            <span>⌕</span>
            <input id="search" placeholder="Buscar pagamento...">
          </label>
        </div>

        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Cliente</th>
                <th>Estacionamento</th>
                <th>Vaga</th>
                <th>Tipo</th>
                <th>Valor</th>
                <th>Data</th>
                <th>Status</th>
              </tr>
            </thead>

            <tbody id="rows"></tbody>
          </table>
        </div>
        <p class="table-count" id="tableCount"></p>
      </section>
    </main>
  </div>

  

  <script src="../../Base/JS/sessao.js"></script>
  <script>
    const icons = {
      grid: '<rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/>',
      building: '<rect x="4" y="3" width="16" height="18" rx="1"/><path d="M8 7h1m3 0h1m3 0h1M8 11h1m3 0h1m3 0h1M8 15h1m3 0h1m3 0h1M10 21v-3h4v3"/>',
      car: '<path d="M5 17H3v-4l2-5h14l2 5v4h-2M5 17h14M7 17v2m10-2v2M5 13h14"/><circle cx="7" cy="15" r="1"/><circle cx="17" cy="15" r="1"/>',
      calendar: '<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/>',
      users: '<circle cx="9" cy="8" r="3"/><path d="M3 21v-2a6 6 0 0 1 12 0v2M16 4a3 3 0 0 1 0 6M21 21v-2a6 6 0 0 0-3-5.2"/>',
      briefcase: '<rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5h8v2M3 12h18M10 12v2h4v-2"/>',
      message: '<path d="M21 11.5a8 8 0 0 1-8.5 8 9 9 0 0 1-4-.9L3 20l1.4-4A8 8 0 1 1 21 11.5Z"/>',
      "credit-card": '<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 10h18M7 15h2"/>',
      chart: '<path d="M4 19V5"/><path d="M4 19h16"/><path d="M8 15v-3"/><path d="M12 15V8"/><path d="M16 15V5"/>',
      settings: '<circle cx="12" cy="12" r="3"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2"/>',
      "log-out": '<path d="M10 17l5-5-5-5M15 12H3M21 19V5a2 2 0 0 0-2-2h-5"/>'
    };

    const svg = (name) => `
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        ${icons[name]}
      </svg>
    `;

    document.querySelectorAll("i[data-icon]").forEach((icon) => {
      icon.outerHTML = svg(icon.dataset.icon);
    });

    const funcionarioLogado = exigirLogin("admin", "../../Base/HTML/OpçãoLogin.html");

    if (funcionarioLogado) {

    mostrarFuncionarioNoPerfil(funcionarioLogado);

    document.querySelector("#btnSair").addEventListener("click", (event) => {
      event.preventDefault();
      sair("../../Base/HTML/Abertura.html");
    });

    let pagamentos = [];

    function mostrarPreco(valor) {
      return Number(valor || 0).toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
    }

    function nomeTipo(tipo) {
      const texto = String(tipo || "").toLowerCase();
      if (texto.includes("pix")) return "Pix";
      if (texto.includes("cart")) return "Cartão";
      return tipo || "--";
    }

    function chaveTipo(tipo) {
      const texto = String(tipo || "").toLowerCase();
      if (texto.includes("pix")) return "pix";
      if (texto.includes("cart")) return "cartao";
      return texto;
    }

    function dataCurta(texto) {
      if (!texto) return "--";
      const data = new Date(texto);
      return `${String(data.getDate()).padStart(2, "0")}/${String(data.getMonth() + 1).padStart(2, "0")}/${data.getFullYear()}`;
    }

    function render() {
      const busca = document.getElementById("search").value.toLowerCase();
      const tipo = document.getElementById("type").value;
      const patio = document.getElementById("parking").value;

      const filtrados = pagamentos.filter((item) => {
        const cliente = item.reservaCli?.usuario?.nome || "";
        const est = item.reservaCli?.reserva?.vaga?.estacionamento?.nome || "";
        const vaga = item.reservaCli?.reserva?.vaga?.numero || "";
        const texto = `${cliente} ${est} ${vaga} ${item.nome} ${item.tipo}`.toLowerCase();
        const idPatio = item.reservaCli?.reserva?.vaga?.fk_est;

        return (
          texto.includes(busca) &&
          (!tipo || chaveTipo(item.tipo) === tipo) &&
          (!patio || idPatio === patio)
        );
      });

      const rows = document.getElementById("rows");
      const count = document.getElementById("tableCount");
      const total = filtrados.reduce((soma, item) => soma + Number(item.valor || 0), 0);

      if (filtrados.length === 0) {
        rows.innerHTML = `<tr><td colspan="7">Nenhum pagamento encontrado.</td></tr>`;
        count.textContent = `Mostrando 0 de ${pagamentos.length} pagamentos`;
        return;
      }

      rows.innerHTML = filtrados.map((item) => `
        <tr>
          <td>${item.reservaCli?.usuario?.nome || "--"}</td>
          <td>${item.reservaCli?.reserva?.vaga?.estacionamento?.nome || "--"}</td>
          <td>${item.reservaCli?.reserva?.vaga?.numero || "--"}</td>
          <td>${nomeTipo(item.tipo)}</td>
          <td><b>${mostrarPreco(item.valor)}</b></td>
          <td>${dataCurta(item.reservaCli?.hora)}</td>
          <td><span class="status pago">Pago</span></td>
        </tr>
      `).join("");

      count.textContent = `Mostrando ${filtrados.length} de ${pagamentos.length} pagamentos · Total: ${mostrarPreco(total)}`;
    }

    async function carregarEstacionamentos() {
      const resposta = await fetch(API + "/estacionamento");
      const lista = await resposta.json();
      if (!resposta.ok) throw new Error(lista.erro || "Erro ao carregar os estacionamentos");

      const select = document.getElementById("parking");
      lista.forEach((patio) => {
        const option = document.createElement("option");
        option.value = patio.id;
        option.textContent = patio.nome;
        select.appendChild(option);
      });
    }

    async function carregar() {
      const resposta = await fetch(API + "/pagamento");
      const lista = await resposta.json();
      if (!resposta.ok) throw new Error(lista.erro || "Erro ao carregar os pagamentos");
      pagamentos = lista;
      render();
    }

    document.getElementById("search").addEventListener("input", render);
    document.getElementById("type").addEventListener("change", render);
    document.getElementById("parking").addEventListener("change", render);

    Promise.all([carregarEstacionamentos(), carregar()]).catch((error) => {
      alert(error.message || "Não foi possível carregar. Verifique se o servidor está ligado.");
    });

    }
  </script>
</body>
</html>
