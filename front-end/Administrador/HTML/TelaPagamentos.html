<body>

      <div class="profile">
        <span class="avatar">A</span>

        <div>
          <strong>Administrador</strong>
          <small>admin</small>
        </div>
      </div>
    </aside>

    <main class="content">
      <header>
        <h1>Pagamentos</h1>
        <p>Acompanhe os pagamentos realizados nas reservas.</p>
      </header>

      <section class="panel">
        <div class="toolbar">
          <label>
            Tipo
            <select id="type">
              <option value="">Todos</option>
              <option>Pix</option>
              <option>Cartão</option>
            </select>
          </label>

          <label>
            Status
            <select id="status">
              <option value="">Todos</option>
              <option>Pago</option>
              <option>Pendente</option>
            </select>
          </label>

          <label class="search">
            <span>⌕</span>
            <input id="search" placeholder="Buscar pagamento...">
          </label>
        </div>

        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Cliente</th>
                <th>Reserva</th>
                <th>Tipo</th>
                <th>Valor</th>
                <th>Data</th>
                <th>Status</th>
              </tr>
            </thead>

            <tbody id="rows"></tbody>
          </table>
        </div>
      </section>
    </main>
  </div>

  

  <script>

    const icons = {


grid:
'<rect x="3" y="3" width="7" height="7"/>'+
'<rect x="14" y="3" width="7" height="7"/>'+
'<rect x="3" y="14" width="7" height="7"/>'+
'<rect x="14" y="14" width="7" height="7"/>',


building:
'<rect x="4" y="3" width="16" height="18" rx="1"/>'+
'<path d="M8 7h1m3 0h1m3 0h1M8 11h1m3 0h1m3 0h1M8 15h1m3 0h1m3 0h1M10 21v-3h4v3"/>',


car:
'<path d="M5 17H3v-4l2-5h14l2 5v4h-2M5 17h14M7 17v2m10-2v2M5 13h14"/>'+
'<circle cx="7" cy="15" r="1"/>'+
'<circle cx="17" cy="15" r="1"/>',


calendar:
'<rect x="3" y="5" width="18" height="16" rx="2"/>'+
'<path d="M16 3v4M8 3v4M3 10h18"/>',


users:
'<circle cx="9" cy="8" r="3"/>'+
'<path d="M3 21v-2a6 6 0 0 1 12 0v2M16 4a3 3 0 0 1 0 6M21 21v-2a6 6 0 0 0-3-5.2"/>',


briefcase:
'<rect x="3" y="7" width="18" height="13" rx="2"/>'+
'<path d="M8 7V5h8v2M3 12h18M10 12v2h4v-2"/>',


message:
'<path d="M21 11.5a8 8 0 0 1-8.5 8 9 9 0 0 1-4-.9L3 20l1.4-4A8 8 0 1 1 21 11.5Z"/>',


"credit-card":
'<rect x="3" y="5" width="18" height="14" rx="2"/>'+
'<path d="M3 10h18M7 15h2"/>',


chart:
'<path d="M4 19V5"/>'+
'<path d="M4 19h16"/>'+
'<path d="M8 15v-3"/>'+
'<path d="M12 15V8"/>'+
'<path d="M16 15V5"/>',


settings:
'<circle cx="12" cy="12" r="3"/>'+
'<path d="M12 2v2m0 16v2M2 12h2m16 0h2"/>',


"log-out":
'<path d="M10 17l5-5-5-5M15 12H3M21 19V5a2 2 0 0 0-2-2h-5"/>'

};


const svg = (name)=>`

<svg viewBox="0 0 24 24"
fill="none"
stroke="currentColor"
stroke-width="1.8"
stroke-linecap="round"
stroke-linejoin="round">

${icons[name]}

</svg>

`;


document.querySelectorAll("i[data-icon]").forEach(icon=>{

icon.outerHTML = svg(icon.dataset.icon);

});



    const payments = [
      ["Maria Eduarda", "#1256", "Pix", "R$ 12,00", "23/05/2025", "Pago"],
      ["João Silva", "#1258", "Cartão", "R$ 12,00", "23/05/2025", "Pendente"],
      ["Ana Paula", "#1259", "Pix", "R$ 18,00", "23/05/2025", "Pago"],
      ["Carlos Lima", "#1260", "Cartão", "R$ 18,00", "22/05/2025", "Pago"]
    ];

    const rows = document.querySelector("#rows");

    function render(data) {
      rows.innerHTML = data.map(
        ([client, booking, type, value, date, status]) => `
          <tr>
            <td>${client}</td>
            <td>${booking}</td>
            <td>${type}</td>
            <td>${value}</td>
            <td>${date}</td>
            <td>
              <span class="status ${status.toLowerCase()}">
                ${status}
              </span>
            </td>
          </tr>
        `
      ).join("");
    }

    function filter() {
      const query = search.value.toLowerCase();
      const selectedType = type.value;
      const selectedStatus = status.value;

      const filtered = payments.filter((payment) => {
        return (
          payment.join(" ").toLowerCase().includes(query) &&
          (!selectedType || payment[2] === selectedType) &&
          (!selectedStatus || payment[5] === selectedStatus)
        );
      });

      render(filtered);
    }

    render(payments);

    search.addEventListener("input", filter);
    type.addEventListener("change", filter);
    status.addEventListener("change", filter);


    


  </script>
</body>
</html>
