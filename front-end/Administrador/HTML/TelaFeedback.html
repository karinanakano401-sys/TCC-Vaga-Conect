    <main class="content">
      <header>
        <h1>Feedbacks</h1>
        <p>Avaliações por estacionamento e por categoria.</p>
      </header>

      <section class="fb-resumo" id="resumo"></section>

      <section class="panel">
        <div class="toolbar">
          <label>
            Estacionamento
            <select id="estacionamento">
              <option value="">Todos</option>
            </select>
          </label>

          <label>
            Categoria
            <select id="categoria">
              <option value="">Todas</option>
            </select>
          </label>

          <label>
            Avaliação
            <select id="rating">
              <option value="">Todos</option>
              <option value="5">5 estrelas</option>
              <option value="4">4 estrelas</option>
              <option value="3">3 estrelas</option>
              <option value="2">2 estrelas</option>
              <option value="1">1 estrela</option>
            </select>
          </label>

          <label class="search">
            <span>⌕</span>
            <input id="search" placeholder="Buscar usuário ou comentário...">
          </label>
        </div>

        <div class="fb-bloco">
          <h2 class="fb-titulo">Desempenho por categoria</h2>
          <div id="barras" class="fb-barras"></div>
        </div>

        <h2 class="fb-titulo">Avaliações <span id="contagem"></span></h2>
        <div id="feedbackList" class="feedback-list"></div>
      </section>
    </main>

  <script src="../../Base/JS/sessao.js"></script>
  <script src="../../Base/JS/avatar.js"></script>
  <script>

    const api = "http://localhost:3333";

    const funcionarioLogado = exigirLogin("admin", "../../Base/HTML/OpçãoLogin.html");

    mostrarFuncionarioNoPerfil(funcionarioLogado);

    document.querySelector("#btnSair").addEventListener("click", (event) => {
      event.preventDefault();
      sair("../../Base/HTML/Abertura.html");
    });


    const icons = {

      grid:
        '<rect x="3" y="3" width="7" height="7"/>' +
        '<rect x="14" y="3" width="7" height="7"/>' +
        '<rect x="3" y="14" width="7" height="7"/>' +
        '<rect x="14" y="14" width="7" height="7"/>',

      building:
        '<rect x="4" y="3" width="16" height="18" rx="1"/>' +
        '<path d="M8 7h1m3 0h1m3 0h1M8 11h1m3 0h1m3 0h1M8 15h1m3 0h1m3 0h1M10 21v-3h4v3"/>',

      car:
        '<path d="M5 17H3v-4l2-5h14l2 5v4h-2M5 17h14M7 17v2m10-2v2M5 13h14"/>' +
        '<circle cx="7" cy="15" r="1"/>' +
        '<circle cx="17" cy="15" r="1"/>',

      calendar:
        '<rect x="3" y="5" width="18" height="16" rx="2"/>' +
        '<path d="M16 3v4M8 3v4M3 10h18"/>',

      users:
        '<circle cx="9" cy="8" r="3"/>' +
        '<path d="M3 21v-2a6 6 0 0 1 12 0v2M16 4a3 3 0 0 1 0 6M21 21v-2a6 6 0 0 0-3-5.2"/>',

      briefcase:
        '<rect x="3" y="7" width="18" height="13" rx="2"/>' +
        '<path d="M8 7V5h8v2M3 12h18M10 12v2h4v-2"/>',

      message:
        '<path d="M21 11.5a8 8 0 0 1-8.5 8 9 9 0 0 1-4-.9L3 20l1.4-4A8 8 0 1 1 21 11.5Z"/>',

        refund: '<path d="M3 12a9 9 0 1 0 3.2-6.9"/><path d="M3 4.5V10h5.5"/>',

      "credit-card":
        '<rect x="3" y="5" width="18" height="14" rx="2"/>' +
        '<path d="M3 10h18M7 15h2"/>',

      chart:
        '<path d="M4 19V5"/>' +
        '<path d="M4 19h16"/>' +
        '<path d="M8 15v-3"/>' +
        '<path d="M12 15V8"/>' +
        '<path d="M16 15V5"/>',

      settings: '<circle cx="12" cy="12" r="3"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4m0-14.2-1.4 1.4M6.3 17.7l-1.4 1.4"/>',
      "log-out": '<path d="M10 17l5-5-5-5M15 12H3M21 19V5a2 2 0 0 0-2-2h-5"/>',

      "log-out":
        '<path d="M10 17l5-5-5-5M15 12H3M21 19V5a2 2 0 0 0-2-2h-5"/>',

      /* novos, usados na tela de prorrogações */
      clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7.5V12l3.5 2"/><path d="M3.5 9.5 6 7l2.5 2.5"/>',
      search: '<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>',
      refresh: '<path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v6h-6"/>'

    };

    let feedbacks = [];
    let categorias = [];

    const list = document.querySelector("#feedbackList");
    const selEstacionamento = document.querySelector("#estacionamento");
    const selCategoria = document.querySelector("#categoria");
    const selNota = document.querySelector("#rating");
    const busca = document.querySelector("#search");

    const SEM_ESTACIONAMENTO = "__sem__";

    function esc(valor) {
      return String(valor ?? "").replace(/[&<>"']/g, (c) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[c]));
    }

    function mostrarData(texto) {
      const data = new Date(texto);
      const dia = String(data.getDate()).padStart(2, "0");
      const mes = String(data.getMonth() + 1).padStart(2, "0");

      return `${dia}/${mes}/${data.getFullYear()}`;
    }

    function estrelas(nota) {
      const n = Math.max(0, Math.min(5, Math.round(Number(nota) || 0)));
      return "★".repeat(n) + "☆".repeat(5 - n);
    }

    function media(valores) {
      return valores.length ? valores.reduce((soma, v) => soma + v, 0) / valores.length : null;
    }

    function formatar(valor) {
      return valor === null ? "--" : valor.toFixed(1).replace(".", ",");
    }

    function rotulo(chave) {
      return categorias.find((c) => c.chave === chave)?.rotulo || chave;
    }

    function posicao(chave) {
      const i = categorias.findIndex((c) => c.chave === chave);
      return i < 0 ? 99 : i;
    }

    // feedbacks de antes da avaliação por estacionamento não têm categorias nem local
    function nomeEstacionamento(item) {
      if (item.estacionamento) return item.estacionamento.nome;
      return item.notas?.length ? "Estacionamento removido" : "Geral (anterior)";
    }

    function preencherFiltros() {
      const anteriorEst = selEstacionamento.value;
      const anteriorCat = selCategoria.value;

      const locais = new Map();
      let temAntigos = false;

      feedbacks.forEach((item) => {
        if (item.fk_est && item.estacionamento) locais.set(item.fk_est, item.estacionamento.nome);
        else temAntigos = true;
      });

      selEstacionamento.innerHTML =
        `<option value="">Todos</option>` +
        [...locais.entries()]
          .sort((a, b) => a[1].localeCompare(b[1]))
          .map(([id, nome]) => `<option value="${esc(id)}">${esc(nome)}</option>`)
          .join("") +
        (temAntigos ? `<option value="${SEM_ESTACIONAMENTO}">Sem estacionamento (anteriores)</option>` : "");

      selCategoria.innerHTML =
        `<option value="">Todas</option>` +
        categorias.map((c) => `<option value="${esc(c.chave)}">${esc(c.rotulo)}</option>`).join("");

      selEstacionamento.value = [...selEstacionamento.options].some((o) => o.value === anteriorEst) ? anteriorEst : "";
      selCategoria.value = [...selCategoria.options].some((o) => o.value === anteriorCat) ? anteriorCat : "";
    }

    // estacionamento e busca valem para tudo; categoria e nota só filtram a lista
    function filtrarBase() {
      const local = selEstacionamento.value;
      const query = busca.value.toLowerCase();

      return feedbacks.filter((item) => {
        if (local === SEM_ESTACIONAMENTO) {
          if (item.fk_est) return false;
        } else if (local && item.fk_est !== local) {
          return false;
        }

        const texto = [
          item.usuario?.nome,
          nomeEstacionamento(item),
          item.assunto,
          item.mensagem,
          ...(item.notas || []).map((n) => n.comentario)
        ].join(" ").toLowerCase();

        return texto.includes(query);
      });
    }

    function renderResumo(base) {
      const estruturadas = base.filter((item) => item.notas?.length);
      const antigos = base.length - estruturadas.length;

      const porCategoria = categorias
        .map((c) => {
          const valores = estruturadas.flatMap((item) =>
            item.notas.filter((n) => n.categoria === c.chave).map((n) => n.nota)
          );
          return { chave: c.chave, rotulo: c.rotulo, media: media(valores), total: valores.length };
        })
        .filter((c) => c.total > 0);

      const ordenadas = [...porCategoria].sort((a, b) => b.media - a.media);
      const melhor = ordenadas[0];
      const pior = ordenadas.length > 1 ? ordenadas[ordenadas.length - 1] : null;

      const cartao = (titulo, valor, detalhe) => `
        <div class="fb-stat">
          <span>${titulo}</span>
          <strong>${valor}</strong>
          <small>${detalhe}</small>
        </div>
      `;

      document.querySelector("#resumo").innerHTML =
        cartao("Avaliações", estruturadas.length, antigos ? `+ ${antigos} feedback${antigos > 1 ? "s" : ""} antigo${antigos > 1 ? "s" : ""}` : "por estacionamento") +
        cartao("Média geral", formatar(media(estruturadas.map((item) => item.nota))), estrelas(media(estruturadas.map((item) => item.nota)))) +
        cartao("Melhor categoria", melhor ? formatar(melhor.media) : "--", melhor ? esc(melhor.rotulo) : "sem dados") +
        cartao("Ponto de atenção", pior ? formatar(pior.media) : "--", pior ? esc(pior.rotulo) : "sem dados");

      document.querySelector("#barras").innerHTML = porCategoria.length === 0
        ? `<p class="fb-vazio">Nenhuma avaliação por categoria nesta seleção.</p>`
        : categorias.map((c) => {
            const dado = porCategoria.find((p) => p.chave === c.chave);
            const largura = dado ? (dado.media / 5) * 100 : 0;
            const nivel = !dado ? "" : dado.media >= 4 ? "alta" : dado.media >= 3 ? "media" : "baixa";

            return `
              <button type="button" class="fb-barra ${dado ? "" : "sem-dado"} ${selCategoria.value === c.chave ? "ativa" : ""}" data-chave="${esc(c.chave)}">
                <span>${esc(c.rotulo)}</span>
                <div class="trilho"><div class="preenche ${nivel}" style="width:${largura}%"></div></div>
                <b>${dado ? formatar(dado.media) : "--"}</b>
                <em>${dado ? dado.total : 0}</em>
              </button>
            `;
          }).join("");
    }

    function renderLista(lista, categoria) {
      document.querySelector("#contagem").textContent = `· ${lista.length}`;

      if (lista.length === 0) {
        list.innerHTML = `<article class="feedback"><div class="fb-com">Nenhuma avaliação encontrada.</div></article>`;
        return;
      }

      list.innerHTML = lista.map((item) => {
        const topo = `
          <div class="feedback-top">
            <span class="stars" title="Nota geral">${estrelas(item.nota)}</span>
            <span class="av-linha">${Avatar.tag(item.usuario)}<strong>${esc(item.usuario?.nome || "Usuário removido")}</strong></span>
            <span class="place">${esc(nomeEstacionamento(item))}</span>
          </div>
        `;

        if (!item.notas?.length) {
          return `
            <article class="feedback">
              ${topo}
              <p><strong>${esc(item.assunto)}</strong> · ${esc(item.categoria)}</p>
              <p>${esc(item.mensagem)}</p>
              <time>${mostrarData(item.createdAt)}</time>
            </article>
          `;
        }

        const notas = item.notas
          .filter((n) => !categoria || n.categoria === categoria)
          .sort((a, b) => posicao(a.categoria) - posicao(b.categoria));

        const vaga = item.reservaCli?.reserva?.vaga?.numero;

        return `
          <article class="feedback">
            ${topo}
            <div class="fb-notas">
              ${notas.map((n) => `
                <div class="fb-nota">
                  <span class="fb-cat">${esc(rotulo(n.categoria))}</span>
                  <span class="stars" title="${n.nota} de 5">${estrelas(n.nota)}</span>
                  ${n.comentario ? `<div class="fb-com">${esc(n.comentario)}</div>` : ""}
                </div>
              `).join("")}
            </div>
            <time>${mostrarData(item.createdAt)}${vaga ? ` · Vaga ${esc(vaga)}` : ""}</time>
          </article>
        `;
      }).join("");
    }

    function filter() {
      const categoria = selCategoria.value;
      const nota = selNota.value;
      const base = filtrarBase();

      const lista = base.filter((item) => {
        if (categoria) {
          const n = item.notas?.find((x) => x.categoria === categoria);
          if (!n) return false;
          return !nota || String(n.nota) === nota;
        }

        return !nota || String(item.nota) === nota;
      });

      renderResumo(base);
      renderLista(lista, categoria);
    }

    async function carregarFeedbacks() {
      try {
        const [respCategorias, respFeedbacks] = await Promise.all([
          fetch(api + "/feedback/categorias"),
          fetch(api + "/feedback")
        ]);

        const cats = await respCategorias.json();
        const lista = await respFeedbacks.json();

        if (!respCategorias.ok || !respFeedbacks.ok) {
          throw new Error(lista.erro || cats.erro || "Erro ao carregar os feedbacks");
        }

        categorias = cats;
        feedbacks = lista;
        preencherFiltros();
        filter();
      } catch (error) {
        list.innerHTML = `<article class="feedback"><div class="fb-com">${esc(error.message || "Não foi possível carregar. Verifique se o servidor está ligado.")}</div></article>`;
      }
    }

    busca.addEventListener("input", filter);
    selNota.addEventListener("change", filter);
    selCategoria.addEventListener("change", filter);
    selEstacionamento.addEventListener("change", filter);

    // clicar numa categoria do desempenho filtra a lista por ela
    document.querySelector("#barras").addEventListener("click", (event) => {
      const botao = event.target.closest(".fb-barra");
      if (!botao || botao.classList.contains("sem-dado")) return;

      selCategoria.value = selCategoria.value === botao.dataset.chave ? "" : botao.dataset.chave;
      filter();
    });


    const svg = (name) => `

<svg viewBox="0 0 24 24"
fill="none"
stroke="currentColor"
stroke-width="1.8"
stroke-linecap="round"
stroke-linejoin="round">

${icons[name]}

</svg>

`;


    document.querySelectorAll("i[data-icon]").forEach(icon => {

      icon.outerHTML = svg(icon.dataset.icon);

    });

    carregarFeedbacks();

    /* =====================================================
   VagaConnect · tema.js

   Liga o modo claro em qualquer tela do sistema.
   O escuro continua sendo o padrão.

   COMO USAR
   Em cada tela, depois do CSS dela:

===================================================== */

(function(){

    "use strict";


    const CHAVE = "vagaconnect-tema";


    // aplica antes de desenhar, para a tela não piscar
    const salvo = localStorage.getItem(CHAVE);

    if(salvo === "claro"){

        document.documentElement.setAttribute("data-tema", "claro");

    }



    /* =================================================
       DESENHOS DO BOTÃO
    ================================================= */

    const sol = `
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="4.2"/>
            <path d="M12 2.5v2.2M12 19.3v2.2M4.2 4.2l1.6 1.6M18.2 18.2l1.6 1.6
                     M2.5 12h2.2M19.3 12h2.2M4.2 19.8l1.6-1.6M18.2 5.8l1.6-1.6"/>
        </svg>`;


    const lua = `
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5Z"/>
        </svg>`;



    /* =================================================
       BOTÃO
    ================================================= */

    function criarBotao(){

        if(document.querySelector(".tema-botao")) return;


        const botao = document.createElement("button");

        botao.className = "tema-botao";

        botao.type = "button";

        document.body.appendChild(botao);


        function pintar(){

            const claro = document.documentElement.getAttribute("data-tema") === "claro";

            botao.innerHTML = claro ? lua : sol;

            botao.title = claro ? "Mudar para o modo escuro" : "Mudar para o modo claro";

            botao.setAttribute("aria-label", botao.title);

            botao.setAttribute("aria-pressed", claro ? "true" : "false");

        }


        botao.addEventListener("click", () => {

            const claro = document.documentElement.getAttribute("data-tema") === "claro";


            if(claro){

                document.documentElement.removeAttribute("data-tema");

                localStorage.setItem(CHAVE, "escuro");

            } else {

                document.documentElement.setAttribute("data-tema", "claro");

                localStorage.setItem(CHAVE, "claro");

            }


            pintar();

        });


        pintar();

    }


    if(document.readyState === "loading"){

        document.addEventListener("DOMContentLoaded", criarBotao);

    } else {

        criarBotao();

    }



    /* =================================================
       ATALHO DE TECLADO: Shift + T
    ================================================= */

    document.addEventListener("keydown", (evento) => {

        if(evento.shiftKey && (evento.key === "T" || evento.key === "t")){

            const alvo = evento.target;

            const digitando = alvo && ["INPUT", "TEXTAREA", "SELECT"].includes(alvo.tagName);

            if(digitando) return;


            const botao = document.querySelector(".tema-botao");

            if(botao) botao.click();

        }

    });

})();
  </script>
</body>
