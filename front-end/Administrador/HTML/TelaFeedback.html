<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VagaConnect | Feedbacks</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="../CSS/TelaFeedback.css">

</head>

<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="logo">
        <i class="fa-solid fa-layer-group"></i>
        <a href="TelaADM.html" class="logo">
          <span>Vaga</span>Connect
        </a>
      </div>

      <nav>

        <a href="../HTML/TelaADM.html">
          <i data-icon="grid"></i>
          Dashboard
        </a>

        <a href="../HTML/TelaEstacionamento.html">
          <i data-icon="building"></i>
          Estacionamentos
        </a>

        <a href="../HTML/TelaVagas.html">
          <i data-icon="car"></i>
          Vagas
        </a>

        <a href="../HTML/TelaReservas.html">
          <i data-icon="calendar"></i>
          Reservas
        </a>

        <a href="../HTML/TelaUsuarios.html">
          <i data-icon="users"></i>
          Usuários
        </a>

        <a href="../HTML/TelaFuncionarios.html">
          <i data-icon="briefcase"></i>
          Funcionários
        </a>

        <a href="../HTML/TelaProrrongações.html">
          <i data-icon="clock"></i>
          Prorrongações
        </a>


        <a class="active">
          <i data-icon="message"></i>
          Feedbacks
        </a>

        <a href="../HTML/TelaPagamentos.html">
          <i data-icon="credit-card"></i>
          Pagamentos
        </a>

        <a href="../HTML/TelaFaturamento.html">
          <i data-icon="chart"></i>
          Faturamento
        </a>

        <a href="../HTML/TelaConfigurações.html">
          <i data-icon="settings"></i>
          Configurações
        </a>

        <a href="#" id="btnSair">
          <i data-icon="log-out"></i>
          Sair
        </a>

      </nav>

      <div class="profile">
        <span class="avatar">A</span>

        <div>
          <strong>Administrador</strong>
          <small>admin</small>
        </div>
      </div>
    </aside>

    <main class="content">
      <header>
        <h1>Feedbacks</h1>
        <p>Acompanhe as avaliações enviadas pelos usuários.</p>
      </header>

      <section class="panel">
        <div class="toolbar">
          <label>
            Avaliação
            <select id="rating">
              <option value="">Todos</option>
              <option value="5">5 estrelas</option>
              <option value="4">4 estrelas</option>
              <option value="3">3 estrelas</option>
              <option value="2">2 estrelas</option>
              <option value="1">1 estrela</option>
            </select>
          </label>

          <label class="search">
            <span>⌕</span>
            <input id="search" placeholder="Buscar feedback...">
          </label>
        </div>

        <div id="feedbackList" class="feedback-list"></div>
      </section>
    </main>
  </div>



  <script src="../../Base/JS/sessao.js"></script>
  <script>

    const api = "http://localhost:3333";

    const funcionarioLogado = exigirLogin("admin", "../../Base/HTML/OpçãoLogin.html");

    mostrarFuncionarioNoPerfil(funcionarioLogado);

    document.querySelector("#btnSair").addEventListener("click", (event) => {
      event.preventDefault();
      sair("../../Base/HTML/Abertura.html");
    });


    const icons = {

      grid:
        '<rect x="3" y="3" width="7" height="7"/>' +
        '<rect x="14" y="3" width="7" height="7"/>' +
        '<rect x="3" y="14" width="7" height="7"/>' +
        '<rect x="14" y="14" width="7" height="7"/>',

      building:
        '<rect x="4" y="3" width="16" height="18" rx="1"/>' +
        '<path d="M8 7h1m3 0h1m3 0h1M8 11h1m3 0h1m3 0h1M8 15h1m3 0h1m3 0h1M10 21v-3h4v3"/>',

      car:
        '<path d="M5 17H3v-4l2-5h14l2 5v4h-2M5 17h14M7 17v2m10-2v2M5 13h14"/>' +
        '<circle cx="7" cy="15" r="1"/>' +
        '<circle cx="17" cy="15" r="1"/>',

      calendar:
        '<rect x="3" y="5" width="18" height="16" rx="2"/>' +
        '<path d="M16 3v4M8 3v4M3 10h18"/>',

      users:
        '<circle cx="9" cy="8" r="3"/>' +
        '<path d="M3 21v-2a6 6 0 0 1 12 0v2M16 4a3 3 0 0 1 0 6M21 21v-2a6 6 0 0 0-3-5.2"/>',

      briefcase:
        '<rect x="3" y="7" width="18" height="13" rx="2"/>' +
        '<path d="M8 7V5h8v2M3 12h18M10 12v2h4v-2"/>',

      message:
        '<path d="M21 11.5a8 8 0 0 1-8.5 8 9 9 0 0 1-4-.9L3 20l1.4-4A8 8 0 1 1 21 11.5Z"/>',

      "credit-card":
        '<rect x="3" y="5" width="18" height="14" rx="2"/>' +
        '<path d="M3 10h18M7 15h2"/>',

      chart:
        '<path d="M4 19V5"/>' +
        '<path d="M4 19h16"/>' +
        '<path d="M8 15v-3"/>' +
        '<path d="M12 15V8"/>' +
        '<path d="M16 15V5"/>',

      settings:
        '<circle cx="12" cy="12" r="3"/>' +
        '<path d="M12 2v2m0 16v2M2 12h2m16 0h2"/>',

      "log-out":
        '<path d="M10 17l5-5-5-5M15 12H3M21 19V5a2 2 0 0 0-2-2h-5"/>',

      /* novos, usados na tela de prorrogações */
      clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7.5V12l3.5 2"/><path d="M3.5 9.5 6 7l2.5 2.5"/>',
      search: '<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>',
      refresh: '<path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v6h-6"/>'

    };

    let feedbacks = [];

    const list = document.querySelector("#feedbackList");

    function mostrarData(texto) {
      const data = new Date(texto);
      const dia = String(data.getDate()).padStart(2, "0");
      const mes = String(data.getMonth() + 1).padStart(2, "0");

      return `${dia}/${mes}/${data.getFullYear()}`;
    }

    function render(data) {
      if (data.length === 0) {
        list.innerHTML = `<article class="feedback"><p>Nenhum feedback encontrado.</p></article>`;
        return;
      }

      list.innerHTML = data.map((item) => `
        <article class="feedback">
          <div class="feedback-top">
            <span class="stars">
              ${"★".repeat(item.nota)}${"☆".repeat(5 - item.nota)}
            </span>

            <strong>${item.usuario.nome}</strong>

            <span class="place">${item.categoria}</span>
          </div>

          <p><strong>${item.assunto}</strong></p>
          <p>${item.mensagem}</p>

          <time>${mostrarData(item.createdAt)}</time>
        </article>
      `).join("");
    }

    function filter() {
      const query = document.querySelector("#search").value.toLowerCase();
      const rating = document.querySelector("#rating").value;

      const filtered = feedbacks.filter((item) => {
        const texto = `${item.usuario.nome} ${item.assunto} ${item.categoria} ${item.mensagem}`.toLowerCase();

        return (
          texto.includes(query) &&
          (!rating || String(item.nota) === rating)
        );
      });

      render(filtered);
    }

    async function carregarFeedbacks() {
      try {
        const resposta = await fetch(api + "/feedback");
        const lista = await resposta.json();

        if (!resposta.ok) {
          throw new Error(lista.erro || "Erro ao carregar os feedbacks");
        }

        feedbacks = lista;
        filter();
      } catch (error) {
        list.innerHTML = `<article class="feedback"><p>${error.message || "Não foi possível carregar. Verifique se o servidor está ligado."}</p></article>`;
      }
    }

    document.querySelector("#search").addEventListener("input", filter);
    document.querySelector("#rating").addEventListener("change", filter);


    const svg = (name) => `

<svg viewBox="0 0 24 24"
fill="none"
stroke="currentColor"
stroke-width="1.8"
stroke-linecap="round"
stroke-linejoin="round">

${icons[name]}

</svg>

`;


    document.querySelectorAll("i[data-icon]").forEach(icon => {

      icon.outerHTML = svg(icon.dataset.icon);

    });

    carregarFeedbacks();
  </script>
</body>

</html>
