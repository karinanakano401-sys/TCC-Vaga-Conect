<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VagaConnect | Reservas do pátio</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="../CSS/TelaFunc.css">
  <link rel="stylesheet" href="../../Base/CSS/presenca.css">
</head>

<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="logo">
        <a href="TelaFunc.html" class="logo">
          <i class="fa-solid fa-layer-group"></i>
          <span>Vaga</span>Connect
        </a>
      </div>
      <nav>
        <a href="TelaFunc.html"><i data-icon="grid"></i>Dashboard</a>
        <a href="TelaFuncVagas.html"><i data-icon="car"></i>Vagas</a>
        <a class="active" href="TelaFuncReservas.html"><i data-icon="calendar"></i>Reservas</a>
        <a href="TelaFuncProrrongações.html"><i data-icon="clock"></i>Prorrongações</a>
        <a href="TelaFuncReembolsos.html"><i data-icon="refund"></i>Reembolsos</a>
        <a href="TelaFuncPagamentos.html"><i data-icon="credit-card"></i>Pagamentos Reserva</a>
        <a href="TelaPagamentosTempo.html"><i data-icon="credit-card"></i>Pagamentos Tempo</a>
        <a href="TelaFuncConta.html"><i data-icon="user"></i>Conta</a>
        <a href="../../Base/HTML/Abertura.html" id="btnSair"><i data-icon="log-out"></i>Sair</a>
      </nav>
      <div class="sidebar-user">
        <div class="user-avatar">F</div>
        <div class="user-info">
          <strong>Funcionário</strong>
          <span>Carregando...</span>
        </div>
      </div>
    </aside>

    <main class="main-content">
      <header class="topbar">
        <div class="page-title">
          <p>SEU PÁTIO</p>
          <h1>Reservas</h1>
        </div>
      </header>

      <section class="panel">
        <div class="toolbar">
          <label>
            Status
            <select id="filtroStatus">
              <option value="">Todos</option>
              <option>Reservada</option>
              <option>Tolerância</option>
              <option>Atraso</option>
              <option>Ativa</option>
              <option>Concluída</option>
              <option>Cancelada</option>
            </select>
          </label>
          <label>
            Buscar
            <input id="busca" type="search" placeholder="Cliente, vaga ou placa">
          </label>
        </div>

        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>CLIENTE</th>
                <th>VAGA</th>
                <th>ENTRADA</th>
                <th>SAÍDA</th>
                <th>STATUS</th>
                <th>AÇÕES</th>
              </tr>
            </thead>
            <tbody id="linhas"></tbody>
          </table>
        </div>
      </section>
    </main>
  </div>

  <script src="../../Base/JS/sessao.js"></script>
  <script src="../../Base/JS/presenca.js"></script>
  <script>
    const icons = {
      grid: '<rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/>',
      car: '<path d="M5 17H3v-4l2-5h14l2 5v4h-2M5 17h14M7 17v2m10-2v2M5 13h14"/><circle cx="7" cy="15" r="1"/><circle cx="17" cy="15" r="1"/>',
      calendar: '<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/>',
      "credit-card": '<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 10h18M7 15h2"/>',
      "log-out": '<path d="M10 17l5-5-5-5M15 12H3M21 19V5a2 2 0 0 0-2-2h-5"/>',
       user: '<circle cx="12" cy="8" r="4"/><path d="M4 21v-1a8 8 0 0 1 16 0v1"/>',
      /* novos, usados na tela de prorrogações */
      clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7.5V12l3.5 2"/><path d="M3.5 9.5 6 7l2.5 2.5"/>',
      search: '<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>',
      refresh: '<path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v6h-6"/>',
      refund: '<path d="M3 12a9 9 0 1 0 3.2-6.9"/><path d="M3 4.5V10h5.5"/>'
    };
    document.querySelectorAll("i[data-icon]").forEach((icon) => {
      icon.outerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${icons[icon.dataset.icon]}</svg>`;
    });

    const funcionario = exigirLogin("funcionario", "../../Base/HTML/OpçãoLogin.html");
    if (!funcionario) { /* redirecionado */ } else {

      mostrarFuncionarioNoPerfil(funcionario);
      document.querySelector("#btnSair").addEventListener("click", (e) => {
        e.preventDefault();
        sair("../../Base/HTML/Abertura.html");
      });

      let reservas = [];
      const esperas = new Map();
      const esperasSaida = new Map();

      function mostrarDataHora(texto) {
        if (!texto) return "--";
        const data = new Date(texto);
        const dia = String(data.getDate()).padStart(2, "0");
        const mes = String(data.getMonth() + 1).padStart(2, "0");
        const hora = String(data.getHours()).padStart(2, "0");
        const minuto = String(data.getMinutes()).padStart(2, "0");
        return `${dia}/${mes} ${hora}:${minuto}`;
      }

      function botoes(item) {
        const status = item.reserva.status;

        if (Presenca.aguardandoChegada(status)) {
          const espera = item.codigoPresenca
            ? `<small class="espera-chip">Aguardando cliente</small>`
            : "";
          const esperaSaida = item.codigoSaida
            ? `<small class="espera-chip">Aguardando saída</small>`
            : "";

          return `
      <div class="acoes">
        <button class="btn btn-verde"
          onclick="abrirChegada('${item.id}')">
          Cliente chegou
        </button>
        <button class="btn btn-vermelho"
          onclick="abrirSaida('${item.id}')">
          Código de saída
        </button>
        ${espera}${esperaSaida}
      </div>
    `;
        }

        if (status === "Ativa") {
          const esperaSaida = item.codigoSaida
            ? `<small class="espera-chip">Aguardando saída</small>`
            : "";
          return `
      <div class="acoes">
        <button class="btn btn-azul"
          onclick="encerrar('${item.id}')">
          Encerrar
        </button>
        <button class="btn btn-vermelho"
          onclick="abrirSaida('${item.id}')">
          Código de saída
        </button>
        ${esperaSaida}
      </div>
    `;
        }

        return "--";
      }

      function render() {
        const status = document.getElementById("filtroStatus").value;
        const busca = document.getElementById("busca").value.toLowerCase();
        const filtradas = reservas.filter((item) => {
          const texto = `${item.usuario?.nome || ""} ${item.reserva.vaga.numero} ${item.carro?.placacarro || ""}`.toLowerCase();
          return (!status || item.reserva.status === status) && texto.includes(busca);
        });

        const corpo = document.getElementById("linhas");
        if (filtradas.length === 0) {
          corpo.innerHTML = `<tr><td colspan="6" class="vazio">Nenhuma reserva neste pátio.</td></tr>`;
          return;
        }

        corpo.innerHTML = filtradas.map((item) => `
        <tr>
          <td>
            <strong>${item.usuario?.nome || "Cliente"}</strong><br>
            <small>${item.carro ? item.carro.modelo + " · " + item.carro.placacarro : "Sem veículo"}</small>
          </td>
          <td><b>${item.reserva.vaga.numero}</b></td>
          <td>${mostrarDataHora(item.hora)}</td>
          <td>${mostrarDataHora(item.horaSaida)}</td>
          <td><span class="status ${String(item.reserva.status || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "")}">${item.reserva.status}</span></td>
          <td>${botoes(item)}</td>
        </tr>
      `).join("");
      }

      async function carregar() {
        const resposta = await fetch(API + "/reservacli");
        const lista = await resposta.json();
        if (!resposta.ok) throw new Error(lista.erro || "Erro ao carregar as reservas");
        reservas = lista
          .filter((item) => item.reserva?.vaga?.fk_est === funcionario.fk_est)
          .sort((a, b) => new Date(b.hora) - new Date(a.hora));
        render();
        sincronizarEsperas();
      }

      async function atualizarVaga(vaga, status) {
        await fetch(API + "/vaga/" + vaga.id, {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            numero: vaga.numero,
            tipo: vaga.tipo,
            status,
            preco: vaga.preco,
            fk_est: vaga.fk_est
          })
        });
      }

      async function atualizarReserva(item, status) {
        const resposta = await fetch(API + "/reserva/" + item.fk_idReserva, {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            status,
            fk_vaga: item.reserva.fk_vaga
          })
        });
        const retorno = await resposta.json();
        if (!resposta.ok) throw new Error(retorno.erro || "Erro ao atualizar a reserva");
      }

      async function abrirChegada(id) {
        const item = reservas.find((reserva) => reserva.id === id);
        if (!item) return;
        Presenca.modalPatio({
          item: item,
          aoConfirmar: carregar,
          aoFechar: carregar
        });
      }

      function abrirSaida(id) {
        const item = reservas.find((reserva) => reserva.id === id);
        if (!item) return;
        Presenca.modalPatioSaida({
          item: item,
          aoConfirmar: carregar,
          aoFechar: carregar
        });
      }

      function sincronizarEsperas() {
        const ids = new Set(
          reservas
            .filter((item) => Presenca.aguardandoChegada(item.reserva?.status) && item.codigoPresenca)
            .map((item) => item.id)
        );

        for (const [id, conn] of [...esperas]) {
          if (!ids.has(id)) {
            conn.fechar();
            esperas.delete(id);
          }
        }

        ids.forEach((id) => {
          if (esperas.has(id)) return;
          esperas.set(id, Presenca.esperar(id, () => {
            const conn = esperas.get(id);
            if (conn) conn.fechar();
            esperas.delete(id);
            carregar();
          }));
        });

        const idsSaida = new Set(
          reservas
            .filter((item) => Presenca.podeEstornar(item.reserva?.status) && item.codigoSaida)
            .map((item) => item.id)
        );

        for (const [id, conn] of [...esperasSaida]) {
          if (!idsSaida.has(id)) {
            conn.fechar();
            esperasSaida.delete(id);
          }
        }

        idsSaida.forEach((id) => {
          if (esperasSaida.has(id)) return;
          esperasSaida.set(id, Presenca.esperar(id, () => {
            const conn = esperasSaida.get(id);
            if (conn) conn.fechar();
            esperasSaida.delete(id);
            carregar();
          }, { evento: "saida-confirmada", status: "Cancelada" }));
        });
      }

      async function encerrar(id) {
        const item = reservas.find((reserva) => reserva.id === id);
        if (!confirm("Encerrar esta reserva e liberar a vaga?")) return;
        try {
          await atualizarReserva(item, "Concluída");
          await atualizarVaga(item.reserva.vaga, "Livre");
          await carregar();
        } catch (error) {
          alert(error.message || "Não foi possível encerrar a reserva.");
        }
      }

      async function cancelar(id) {
        const item = reservas.find((reserva) => reserva.id === id);
        if (!confirm("Cancelar esta reserva?")) return;
        try {
          await atualizarReserva(item, "Cancelada");
          await atualizarVaga(item.reserva.vaga, "Livre");
          await carregar();
        } catch (error) {
          alert(error.message || "Não foi possível cancelar a reserva.");
        }
      }

      window.abrirChegada = abrirChegada;
      window.abrirSaida = abrirSaida;
      window.encerrar = encerrar;

      document.getElementById("filtroStatus").addEventListener("change", render);
      document.getElementById("busca").addEventListener("input", render);

      carregar().catch((error) => alert(error.message || "Verifique se o servidor está ligado."));
    }
  </script>
</body>

</html>
